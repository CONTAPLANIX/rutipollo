  function descargarPdfsMasivo(ventas, desde, hasta){
    var direccionesPromise = Promise.all(ventas.map(function(v){
      return v.ubicacion ? reverseGeocode(v.ubicacion) : Promise.resolve(null);
    }));
    Promise.all([conLogoDataUrl(), direccionesPromise]).then(function(res){
      var logoDataUrl = res[0], direcciones = res[1];
      var blob = buildMultiTicketPdfBlob(ventas, logoDataUrl, direcciones);
      if(!blob){ alert("No se pudo preparar el PDF. Intenta de nuevo en unos segundos."); return; }
      triggerDownload("notas_"+desde+"_a_"+hasta+".pdf", blob);
    });
  }

  function openAjustes(){
    var root = document.getElementById("overlay-root");
    var n = state.negocio;
    var soyAdmin = esAdmin(currentUser);
    var userRows = state.usuarios.length ? state.usuarios.map(function(u){
      return '<div class="note-row"><div class="who">'+escapeHtml(u.nombre)+(u.rol==="admin"?' <span class="pay-tag banco">admin</span>':'')+(currentUser&&currentUser.id===u.id?' <span class="pay-tag efectivo">tú</span>':'')+'</div>'
        + (soyAdmin ? '<button class="btn btn-sm btn-danger" data-action="eliminar-usuario" data-id="'+u.id+'">Eliminar</button>' : '')+'</div>';
    }).join("") : '<p class="empty" style="padding:8px 0;">Aún no hay usuarios.</p>';
    root.innerHTML = ''
      + '<div class="overlay" data-action="cerrar-overlay">'
      + '  <div class="modal">'
      + '    <h2>Configuración</h2>'
      + '    <div class="field"><label for="a-nombre">Nombre del negocio / vendedor</label><input id="a-nombre" type="text" value="'+escapeHtml(n.nombre||"")+'"></div>'
      + '    <div class="field"><label for="a-telefono">Teléfono</label><input id="a-telefono" type="text" value="'+escapeHtml(n.telefono||"")+'"></div>'
      + '    <div class="field"><label for="a-direccion">Dirección / lugar de emisión</label><input id="a-direccion" type="text" placeholder="Ej: Av. Los Pollos 123, Lima" value="'+escapeHtml(n.direccion||"")+'"></div>'
      + '    <div class="field"><label for="a-pie">Mensaje al pie de la nota</label><input id="a-pie" type="text" value="'+escapeHtml(n.pie||"")+'"></div>'
      + '    <div class="actions-row"><button class="btn" data-action="cerrar-overlay">Cancelar</button><button class="btn btn-primary" data-action="guardar-ajustes">Guardar</button></div>'
      + '    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">'
      + '    <h2 style="font-size:15px;">Usuarios que pueden entrar</h2>'
      + '    <div style="margin-bottom:12px;">'+userRows+'</div>'
      + (soyAdmin ? ''
        + '    <div class="row2">'
        + '      <input id="nu-nombre" type="text" placeholder="Nombre">'
        + '      <input id="nu-pin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN (4 dígitos)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'
        + '    </div>'
        + '    <div class="actions-row"><button class="btn btn-sm" data-action="agregar-usuario">+ Agregar usuario</button></div>'
        + '    <p class="section-sub" style="margin-top:10px;">El PIN identifica a cada persona, no es una contraseña de alta seguridad — cualquiera con el enlace y suficiente esfuerzo técnico podría verlo.</p>'
        : '    <p class="section-sub" style="margin-top:4px;">Solo un administrador puede agregar o quitar usuarios.</p>')
      + '  </div>'
      + '</div>';
  }

  function closeOverlay(){ document.getElementById("overlay-root").innerHTML = ""; }

  // ---------- events ----------

  document.getElementById("tabbar").addEventListener("click", function(e){
    var btn = e.target.closest("[data-tab]");
    if(!btn) return;
    var newTab = btn.getAttribute("data-tab");
    if(newTab!=="nueva" && editingVentaId){
      editingVentaId = null;
      draft = { fecha: todayISO(), cliente:"", notas:"", tipoPago:"contado", metodoPago:"efectivo", items:[blankItem()] };
    }
    state.tab = newTab;
    renderTab();
  });

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");

    if(action==="elegir-cliente"){
      draft.cliente = t.getAttribute("data-val");
      var fc = document.getElementById("f-cliente");
      if(fc) fc.value = draft.cliente;
      hideAllSuggestions();
    }
    else if(action==="elegir-producto"){
      var pidx = Number(t.getAttribute("data-idx"));
      var pnombre = t.getAttribute("data-val");
      var pprecio = Number(t.getAttribute("data-precio"))||0;
      if(!draft.items[pidx]) return;
      draft.items[pidx].producto = pnombre;
      if(pprecio && !draft.items[pidx].precio) draft.items[pidx].precio = pprecio;
      hideAllSuggestions();
      renderTab();
    }
    else if(action==="pago"){ draft.metodoPago = t.getAttribute("data-val"); renderTab(); }
    else if(action==="tipo-pago"){ draft.tipoPago = t.getAttribute("data-val"); renderTab(); }
    else if(action==="agregar-item"){ draft.items.push(blankItem()); renderTab(); }
    else if(action==="quitar-item"){
      var idx = Number(t.getAttribute("data-idx"));
      draft.items.splice(idx,1);
      if(draft.items.length===0) draft.items.push(blankItem());
      renderTab();
    }
    else if(action==="limpiar-venta"){
      draft = { fecha: todayISO(), cliente:"", notas:"", tipoPago:"contado", metodoPago:"efectivo", items:[blankItem()] };
      editingVentaId = null;
      renderTab();
    }
    else if(action==="cancelar-edicion-venta"){
      draft = { fecha: todayISO(), cliente:"", notas:"", tipoPago:"contado", metodoPago:"efectivo", items:[blankItem()] };
      editingVentaId = null;
      renderTab();
    }
    else if(action==="guardar-venta"){
      var fecha = document.getElementById("f-fecha").value || todayISO();
      var cliente = document.getElementById("f-cliente").value.trim();
      var notas = document.getElementById("f-notas").value.trim();
      var validItems = draft.items.filter(function(i){ return String(i.producto).trim() && Number(i.cantidad)>0; })
        .map(function(i){ return { producto:String(i.producto).trim(), cantidad:Number(i.cantidad), precio:Number(i.precio)||0 }; });
      if(!cliente){ alert("Ingresa el nombre del cliente o puesto."); return; }
      if(!validItems.length){ alert("Agrega al menos un producto con cantidad."); return; }
      var total = validItems.reduce(function(s,i){return s+i.cantidad*i.precio;},0);
      var fp = parseFecha(fecha);
      var tipoPago = draft.tipoPago==="credito" ? "credito" : "contado";
      var pagado = tipoPago==="contado";
      var metodoFinal = pagado ? (draft.metodoPago||"efectivo") : null;
      var fechaPago = pagado ? fecha : null;
      if(editingVentaId){
        var original = state.ventas.find(function(v){ return v.id===editingVentaId; });
        var ventaEditada = Object.assign({}, original, { fecha:fecha, anio:fp.anio, mes:fp.mes, dia:fp.dia, cliente:cliente, items:validItems, total:total, notas:notas, tipoPago:tipoPago, metodoPago:metodoFinal, pagado:pagado, fechaPago:fechaPago });
        editingVentaId = null;
        draft = { fecha: todayISO(), cliente:"", notas:"", tipoPago:"contado", metodoPago:"efectivo", items:[blankItem()] };
        renderTab();
        updateVenta(ventaEditada);
      } else {
        var maxCorr = state.ventas.reduce(function(m,v){return Math.max(m, v.correlativo||0);},0);
        var venta = { fecha:fecha, anio:fp.anio, mes:fp.mes, dia:fp.dia, cliente:cliente, items:validItems, total:total, notas:notas, tipoPago:tipoPago, metodoPago:metodoFinal, pagado:pagado, fechaPago:fechaPago, vendedor: currentUser?currentUser.nombre:"", correlativo:maxCorr+1, creadoEn:Date.now() };
        draft = { fecha: todayISO(), cliente:"", notas:"", tipoPago:"contado", metodoPago:"efectivo", items:[blankItem()] };
        renderTab();
        ensureCliente(cliente);
        obtenerUbicacion().then(function(ubicacion){
          if(ubicacion) venta.ubicacion = ubicacion;
          saveVenta(venta);
        });
      }
    }
    else if(action==="ver-venta"){
      var v = state.ventas.find(function(x){return x.id===t.getAttribute("data-id");});
      if(v) openTicket(v);
    }
    else if(action==="editar-venta"){
      var ve = state.ventas.find(function(x){return x.id===t.getAttribute("data-id");});
      if(ve){
        editingVentaId = ve.id;
        draft = { fecha: ve.fecha, cliente: ve.cliente, notas: ve.notas||"", tipoPago: ve.tipoPago==="credito"?"credito":"contado", metodoPago: ve.metodoPago||"efectivo",
          items: ve.items.map(function(i){ return { producto:i.producto, cantidad:i.cantidad, precio:i.precio }; }) };
        closeOverlay();
        state.tab = "nueva";
        renderTab();
      }
    }
    else if(action==="eliminar-venta"){
      if(confirm("¿Eliminar esta nota de venta? Esta acción no se puede deshacer.")){
        deleteVenta(t.getAttribute("data-id"));
        closeOverlay();
      }
    }
    else if(action==="cerrar-overlay"){ if(e.target===t || e.target.classList.contains("overlay")) closeOverlay(); }
    else if(action==="imprimir-ticket"){ window.print(); }
    else if(action==="descargar-pdf-ticket"){ if(currentTicketVenta) descargarPdfTicket(currentTicketVenta); }
    else if(action==="abrir-ajustes"){ openAjustes(); }
    else if(action==="guardar-ajustes"){
      var data = Object.assign({}, state.negocio, {
        nombre: document.getElementById("a-nombre").value.trim() || "Rico Pollo Dissur",
        telefono: document.getElementById("a-telefono").value.trim(),
        direccion: document.getElementById("a-direccion").value.trim(),
        pie: document.getElementById("a-pie").value.trim() || "Gracias por su Compra. ¡Hasta la próxima entrega!"
      });
      saveNegocio(data);
      closeOverlay();
    }
    else if(action==="editar-producto"){ ui.editingProductoId = t.getAttribute("data-id"); renderTab(); }
    else if(action==="cancelar-edicion-producto"){ ui.editingProductoId = null; renderTab(); }
    else if(action==="guardar-producto"){
      var codigo = document.getElementById("p-codigo").value.trim();
      var nombre = document.getElementById("p-nombre").value.trim();
      var precio = Number(document.getElementById("p-precio").value)||0;
      var unidad = document.getElementById("p-unidad").value.trim();
      if(!nombre){ alert("Ingresa el nombre del producto."); return; }
      var pid = t.getAttribute("data-id");
      ui.editingProductoId = null;
      saveProducto(pid ? { id:pid, codigo:codigo, nombre:nombre, precio:precio, unidad:unidad } : { codigo:codigo, nombre:nombre, precio:precio, unidad:unidad });
    }
    else if(action==="eliminar-producto"){
      if(confirm("¿Eliminar este producto del catálogo?")) deleteProducto(t.getAttribute("data-id"));
    }
    else if(action==="sincronizar-ahora"){ refreshSyncBadge(); syncPending(); }
    else if(action==="activar-seleccion"){ ui.selectMode = true; ui.selected = {}; renderTab(); }
    else if(action==="cancelar-seleccion"){ ui.selectMode = false; ui.selected = {}; renderTab(); }
    else if(action==="seleccionar-todo-anio"){
      groupByYear(ui.historialYear).forEach(function(v){ ui.selected[v.id] = true; });
      renderTab();
    }
    else if(action==="eliminar-seleccionadas"){
      var ids = Object.keys(ui.selected).filter(function(id){ return ui.selected[id]; });
      if(!ids.length) return;
      if(confirm("¿Eliminar "+ids.length+" nota(s) de venta seleccionadas? Esta acción no se puede deshacer.")){
        ids.forEach(function(id){ deleteVenta(id); });
        ui.selectMode = false; ui.selected = {};
        renderTab();
      }
    }
    else if(action==="toggle-solo-mios"){ ui.soloMisVentas = !ui.soloMisVentas; renderTab(); }
    else if(action==="registrar-abono"){
      var vid = t.getAttribute("data-id");
      var metodo = t.getAttribute("data-metodo");
      var vv = state.ventas.find(function(x){ return x.id===vid; });
      var input = document.querySelector('.abono-monto[data-id="'+vid+'"]');
      var monto = input ? Number(input.value) : 0;
      if(!vv) return;
      if(!(monto>0)){ alert("Ingresa un monto válido."); return; }
      var saldoAntes = saldoPendiente(vv);
      var esCompleto = monto >= saldoAntes - 0.009;
      var pregunta = esCompleto
        ? "¿Marcar la nota N° "+String(vv.correlativo).padStart(6,"0")+" ("+fmt(saldoAntes)+") como pagada por "+metodoLabel(metodo)+"?"
        : "¿Registrar un abono de "+fmt(monto)+" (de "+fmt(saldoAntes)+" pendiente) por "+metodoLabel(metodo)+"?";
      if(confirm(pregunta)){
        registrarAbono(vv, monto, metodo);
        renderTab();
      }
    }
    else if(action==="exportar-csv"){ exportarCSV(); }
    else if(action==="exportar-todo-csv"){ exportarTodoCSV(); }
    else if(action==="abrir-descarga-masiva"){ openDescargaMasivaModal(); }
    else if(action==="rango-preset"){
      var preset = t.getAttribute("data-preset");
      var hoyP = todayISO();
      var desdeEl = document.getElementById("dm-desde"), hastaEl = document.getElementById("dm-hasta");
      if(preset==="hoy"){ desdeEl.value = hoyP; hastaEl.value = hoyP; }
      else if(preset==="semana"){ desdeEl.value = addDaysISO(hoyP,-6); hastaEl.value = hoyP; }
      else if(preset==="mes"){ desdeEl.value = hoyP.slice(0,8)+"01"; hastaEl.value = hoyP; }
    }
    else if(action==="descargar-pdfs-rango"){
      var rDesde = document.getElementById("dm-desde").value;
      var rHasta = document.getElementById("dm-hasta").value;
      if(!rDesde || !rHasta){ alert("Selecciona las dos fechas."); return; }
      if(rDesde>rHasta){ alert("La fecha 'Desde' no puede ser mayor que 'Hasta'."); return; }
      var ventasRango = state.ventas.filter(function(v){ return v.fecha>=rDesde && v.fecha<=rHasta; })
        .filter(function(v){ return !ui.soloMisVentas || !currentUser || v.vendedor===currentUser.nombre; })
        .sort(function(a,b){ return (a.creadoEn||0)-(b.creadoEn||0); });
      if(!ventasRango.length){ alert("No hay notas de venta en ese rango de fechas."); return; }
      closeOverlay();
      descargarPdfsMasivo(ventasRango, rDesde, rHasta);
    }
    else if(action==="resumen-year-prev"){ ui.resumenYear--; renderTab(); }
    else if(action==="resumen-year-next"){ ui.resumenYear++; renderTab(); }
    else if(action==="resumen-month-prev"){ ui.resumenMonth = ui.resumenMonth===0 ? 12 : ui.resumenMonth-1; renderTab(); }
    else if(action==="resumen-month-next"){ ui.resumenMonth = ui.resumenMonth===12 ? 0 : ui.resumenMonth+1; renderTab(); }
    else if(action==="resumen-vista"){ ui.resumenVista = t.getAttribute("data-vista"); renderTab(); }
    else if(action==="cobrar-vista"){ ui.cobrarVista = t.getAttribute("data-vista"); renderTab(); }
    else if(action==="cobrar-year-prev"){ ui.cobrarYear--; renderTab(); }
    else if(action==="cobrar-year-next"){ ui.cobrarYear++; renderTab(); }
    else if(action==="cobrar-month-prev"){ ui.cobrarMonth = ui.cobrarMonth===1 ? 12 : ui.cobrarMonth-1; if(ui.cobrarMonth===12) ui.cobrarYear--; renderTab(); }
    else if(action==="cobrar-month-next"){ ui.cobrarMonth = ui.cobrarMonth===12 ? 1 : ui.cobrarMonth+1; if(ui.cobrarMonth===1) ui.cobrarYear++; renderTab(); }
    else if(action==="cambiar-usuario"){
      if(confirm("¿Cambiar de usuario?")) logout();
    }
    else if(action==="agregar-usuario"){
      if(!esAdmin(currentUser)) return;
      var unombre = document.getElementById("nu-nombre").value.trim();
      var upin = document.getElementById("nu-pin").value.trim();
      if(!unombre){ alert("Ingresa el nombre del usuario."); return; }
      if(!/^\d{4}$/.test(upin)){ alert("El PIN debe tener exactamente 4 dígitos."); return; }
      saveUsuario({ nombre:unombre, pin:upin, rol:"vendedor" });
      openAjustes();
    }
    else if(action==="eliminar-usuario"){
      if(!esAdmin(currentUser)) return;
      if(confirm("¿Eliminar este usuario? Ya no podrá entrar con su PIN.")){
        deleteUsuario(t.getAttribute("data-id"));
        openAjustes();
      }
    }
    else if(action==="agregar-cliente"){
      var ncNombre = document.getElementById("nc-nombre").value.trim();
      if(!ncNombre){ alert("Ingresa el nombre del cliente."); return; }
      var ncId = t.getAttribute("data-id");
      if(ncId){
        var ce = state.clientes.find(function(c){return c.id===ncId;});
        saveCliente(Object.assign({}, ce, { nombre: ncNombre }));
      } else {
        saveCliente({ nombre: ncNombre });
      }
      ui.editingClienteId = null;
      renderTab();
    }
    else if(action==="editar-cliente"){ ui.editingClienteId = t.getAttribute("data-id"); renderTab(); }
    else if(action==="cancelar-edicion-cliente"){ ui.editingClienteId = null; renderTab(); }
    else if(action==="eliminar-cliente"){
      if(confirm("¿Eliminar este cliente de la lista? Sus notas de venta ya registradas no se borran.")){
        deleteCliente(t.getAttribute("data-id"));
        ui.editingClienteId = null;
        renderTab();
      }
    }
    else if(action==="crear-usuario"){
      var cNombre = document.getElementById("gate-nombre").value.trim();
      var cPin1 = document.getElementById("gate-pin1").value.trim();
      var cPin2 = document.getElementById("gate-pin2").value.trim();
      if(!cNombre){ ui.gateError = "Ingresa tu nombre."; renderGate(); return; }
      if(!/^\d{4}$/.test(cPin1)){ ui.gateError = "El PIN debe tener 4 dígitos."; renderGate(); return; }
      if(cPin1 !== cPin2){ ui.gateError = "Los PIN no coinciden."; renderGate(); return; }
      var nu = saveUsuario({ nombre:cNombre, pin:cPin1 });
      loginAs(nu);
    }
    else if(action==="gate-elegir"){
      ui.gateMode = "pin";
      ui.gateSelectedId = t.getAttribute("data-id");
      ui.gateError = "";
      renderGate();
    }
    else if(action==="gate-volver"){
      ui.gateMode = "elegir"; ui.gateSelectedId = null; ui.gateError = "";
      renderGate();
    }
    else if(action==="gate-nuevo-usuario"){
      ui.gateMode = "crear"; ui.gateError = "";
      renderGate();
    }
    else if(action==="confirmar-pin"){
      var pinVal = document.getElementById("gate-pin").value.trim();
      var su = state.usuarios.find(function(x){ return x.id===ui.gateSelectedId; });
      if(su && su.pin === pinVal){ loginAs(su); }
      else { ui.gateError = "PIN incorrecto."; renderGate(); }
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var id = e.target && e.target.id;
    if(id==="gate-pin"){ e.preventDefault(); document.querySelector('[data-action="confirmar-pin"]').click(); }
    else if(id==="gate-pin2" || id==="gate-pin1" || id==="gate-nombre"){ e.preventDefault(); document.querySelector('[data-action="crear-usuario"]').click(); }
    else if(id==="nu-pin" || id==="nu-nombre"){ e.preventDefault(); document.querySelector('[data-action="agregar-usuario"]').click(); }
  });

  document.addEventListener("input", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("item-input")){
      var idx = Number(t.getAttribute("data-idx"));
      var field = t.getAttribute("data-field");
      if(!draft.items[idx]) return;
      draft.items[idx][field] = field==="producto" ? t.value : Number(t.value);
      var sub = (Number(draft.items[idx].cantidad)||0) * (Number(draft.items[idx].precio)||0);
      var subEl = document.getElementById("subtotal-"+idx);
      if(subEl) subEl.textContent = fmt(sub);
      var totalEl = document.getElementById("draft-total");
      if(totalEl) totalEl.textContent = fmt(draftTotal());
      if(field==="producto") showProductoSuggestions(idx, t.value);
    }
    else if(t.id==="f-cliente"){ showClienteSuggestions(t.value); }
  });

  document.addEventListener("focusin", function(e){
    var t = e.target;
    if(t.id==="f-cliente"){ showClienteSuggestions(t.value); }
    else if(t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto"){
      showProductoSuggestions(Number(t.getAttribute("data-idx")), t.value);
    }
  });

  document.addEventListener("focusout", function(e){
    var t = e.target;
    if(t.id==="f-cliente" || (t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto")){
      setTimeout(hideAllSuggestions, 180);
    }
  });

  document.addEventListener("change", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("sel-check")){
      var vid = t.getAttribute("data-id");
      if(t.checked) ui.selected[vid] = true; else delete ui.selected[vid];
      var btn = document.querySelector('[data-action="eliminar-seleccionadas"]');
      if(btn){
        var n = Object.keys(ui.selected).filter(function(id){return ui.selected[id];}).length;
        btn.textContent = "Eliminar ("+n+")";
        btn.disabled = n===0;
      }
    }
    else if(t.id==="hist-year"){ ui.historialYear = Number(t.value); ui.selectMode=false; ui.selected={}; renderTab(); }
    else if(t.id==="resumen-dia-picker"){ ui.resumenDiaSel = t.value; renderTab(); }
    else if(t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto"){
      var idx = Number(t.getAttribute("data-idx"));
      var match = state.productos.find(function(p){ return p.nombre.trim().toLowerCase()===t.value.trim().toLowerCase(); });
      if(match && (!draft.items[idx].precio || draft.items[idx].precio===0)){
        draft.items[idx].precio = match.precio;
        var precioInput = document.querySelector('input[data-field="precio"][data-idx="'+idx+'"]');
        if(precioInput) precioInput.value = match.precio;
        var sub = (Number(draft.items[idx].cantidad)||0) * match.precio;
        var subEl = document.getElementById("subtotal-"+idx);
        if(subEl) subEl.textContent = fmt(sub);
        var totalEl = document.getElementById("draft-total");
        if(totalEl) totalEl.textContent = fmt(draftTotal());
      }
    }
    else if(t.id==="f-fecha"){ draft.fecha = t.value; }
    else if(t.id==="f-cliente"){ draft.cliente = t.value; }
    else if(t.id==="f-notas"){ draft.notas = t.value; }
  });

  initStore();
})();
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
