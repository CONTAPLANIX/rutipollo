  // ---------- exportar CSV ----------

  function csvEscape(val){
    var s = String(val==null?"":val);
    if(/[",\r\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  function buildVentasCsv(ventas){
    var header = ["Correlativo","Fecha","Cliente","Código","Producto","Cantidad","Kg","Precio unitario","Subtotal","Total nota","Tipo de venta","Estado","Saldo pendiente","Forma de pago","Vendedor","Ubicación (mapa)","Notas"];
    var rows = [header];
    ventas.slice().sort(function(a,b){ return (a.creadoEn||0)-(b.creadoEn||0); }).forEach(function(v){
      var estado = estaPendiente(v) ? (esPagoParcial(v)?"Abono parcial":"Pendiente") : "Pagado";
      (v.items||[]).forEach(function(it){
        rows.push([
          v.correlativo, v.fecha, v.cliente, codigoItem(it), it.producto, it.cantidad, it.kg||"", it.precio,
          subtotalItem(it, !v.redondeo).toFixed(2), Number(v.total).toFixed(2),
          v.tipoPago==="credito"?"Pendiente de pago":"Contado", estado, saldoPendiente(v).toFixed(2),
          v.metodoPago ? metodoLabel(v.metodoPago) : "", v.vendedor||"",
          v.ubicacion ? mapsLink(v.ubicacion) : "", v.notas||""
        ]);
      });
    });
    return rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }

  function marcarRespaldoHecho(){
    try{ localStorage.setItem(LS.lastBackup, String(Date.now())); }catch(e){}
  }

  function triggerDownload(filename, data){
    var blob = (data instanceof Blob) ? data : new Blob([data], { type:"text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function diasDesdeRespaldo(){
    var raw;
    try{ raw = localStorage.getItem(LS.lastBackup); }catch(e){ raw = null; }
    if(!raw) return Infinity;
    return (Date.now() - Number(raw)) / 86400000;
  }

  function descargarCsvGenerico(ventas, filename){
    if(!ventas.length){ alert("No hay notas para exportar."); return; }
    var csv = String.fromCharCode(0xFEFF) + buildVentasCsv(ventas);
    triggerDownload(filename, new Blob([csv], { type:"text/csv;charset=utf-8" }));
    marcarRespaldoHecho();
    renderTab();
  }

  function loadImageAsDataUrl(url){

      return new Promise(function(resolve, reject){
        var reader = new FileReader();

  function ticketHeightMm(venta, logoDataUrl, direccionTexto){
    // Se dibuja la nota en una hoja de prueba y se mide hasta donde llego,
    // asi la hoja final queda exacta, sin cortes ni espacio en blanco.
    var J = window.jspdf && window.jspdf.jsPDF;
    var probe = new J({ unit:"mm", format:[80, 3000] });
    return Math.max(drawTicketOnDoc(probe, venta, logoDataUrl, direccionTexto) + 12, 50);
  }

  function drawTicketOnDoc(doc, venta, logoDataUrl, direccionTexto){
    var x = 5, w = 70, y = 5;
    function center(text, size, bold){ doc.setFont("courier", bold?"bold":"normal"); doc.setFontSize(size); doc.text(String(text), x+w/2, y, {align:"center", maxWidth:w}); }
    function row(label, val, size, bold){
      doc.setFont("courier", bold?"bold":"normal"); doc.setFontSize(size||9.5);
      var lw = doc.getTextWidth(label) + 3;
      var lines = doc.splitTextToSize(String(val), w - lw);
      doc.text(label, x, y);
      lines.forEach(function(ln, i){ doc.text(ln, x+w, y + i*4.3, {align:"right"}); });
      y += 5.2 + (lines.length-1)*4.3;
    }

    if(logoDataUrl){
      try{ doc.addImage(logoDataUrl, "PNG", x+w/2-13, y, 26, 26); y += 30; }catch(e){}
    } else {
      y += 4; center(state.negocio.nombre||"Rico Pollo Dissur", 13, true); y+=6;
    }
    if(state.negocio.telefono){ center("Tel. "+state.negocio.telefono, 8.5, false); y+=4.6; }
    if(state.negocio.direccion){ center(state.negocio.direccion, 8.5, false); y+=4.6; }
    y += 1.4;
    center("NOTA DE VENTA", 10, false); y+=6.2;
    center("N° "+String(venta.correlativo).padStart(6,"0"), 15, true); y+=4;
    doc.setLineWidth(0.1); doc.line(x, y, x+w, y); y += 5;

    row("Fecha", fechaDisplay(venta.fecha));
    if(venta.creadoEn) row("Hora", horaDisplay(venta.creadoEn));
    row("Cliente", venta.cliente);
    if(venta.vendedor) row("Vendedor", venta.vendedor);
    if(venta.ubicacion){
      y+=0.5;
      doc.setFont("courier","bold"); doc.setFontSize(8.5); doc.text("Ubicación:", x, y); y+=3.8;
      doc.setFont("courier","normal"); doc.setFontSize(8);
      var dirTxt = direccionTexto || (venta.ubicacion.lat.toFixed(5)+", "+venta.ubicacion.lon.toFixed(5));
      var dirLines = doc.splitTextToSize(dirTxt, w);
      doc.text(dirLines, x, y);
      y += dirLines.length*3.4 + 1;
    }
    y += 1.5;

    doc.setFont("courier","bold"); doc.setFontSize(8); doc.text("MONEDA: "+MONEDA_NOMBRE, x, y); y += 2.6;
    // Tabla: CÓD | PRODUCTO | CANT | KG | P.UNIT | TOTAL
    var cb = [x, x+10, x+28.5, x+36, x+45.5, x+57, x+w];
    var headerH = 5.8, fs = 6.8, lh = 3.1, cap = 1.75;
    var tableTop = y;
    var nomW = cb[2]-cb[1]-1.6;
    doc.setFont("courier","normal"); doc.setFontSize(fs);
    var filas = venta.items.map(function(it){
      var lines = doc.splitTextToSize(String(it.producto), nomW);
      if(lines.length > 3) lines = lines.slice(0,3);
      return { it: it, lines: lines, h: Math.max(6, lines.length*lh + 2.6) };
    });
    var tableH = headerH + filas.reduce(function(a,f){ return a+f.h; }, 0);

    doc.setLineWidth(0.2);
    doc.rect(x, tableTop, w, tableH);
    for(var ci=1; ci<cb.length-1; ci++){ doc.line(cb[ci], tableTop, cb[ci], tableTop+tableH); }
    doc.line(x, tableTop+headerH, x+w, tableTop+headerH);

    var hy = tableTop + headerH/2 + 1.1;
    doc.setFont("courier","bold"); doc.setFontSize(6);
    // Cada titulo va completo si cabe en su casilla; solo se abrevia cuando hace falta.
    function cabecera(opciones, ancho){
      for(var oi=0; oi<opciones.length; oi++){ if(doc.getTextWidth(opciones[oi]) <= ancho - 1.6) return opciones[oi]; }
      return opciones[opciones.length-1];
    }
    doc.text(cabecera(["CÓDIGO","CÓD."], cb[1]-cb[0]), cb[0]+0.8, hy);
    doc.text(cabecera(["DESCRIPCIÓN","DESCRIP.","DESC."], cb[2]-cb[1]), cb[1]+0.8, hy);
    doc.text(cabecera(["CANTIDAD","CANT.","CAN."], cb[3]-cb[2]), cb[3]-0.8, hy, {align:"right"});
    doc.text(cabecera(["KG"], cb[4]-cb[3]), cb[4]-0.8, hy, {align:"right"});
    doc.text(cabecera(["P. UNITARIO","P.UNIT.","P.U."], cb[5]-cb[4]), cb[5]-0.8, hy, {align:"right"});
    doc.text(cabecera(["IMPORTE","IMP."], cb[6]-cb[5]), cb[6]-0.8, hy, {align:"right"});

    doc.setFont("courier","normal"); doc.setFontSize(fs);
    var ry = tableTop + headerH;
    filas.forEach(function(f, idx){
      var it = f.it;
      var textH = cap + (f.lines.length-1)*lh;
      var ty = ry + (f.h - textH)/2 + cap;
      doc.setFontSize(6.5);
      doc.text(codigoItem(it) || "-", cb[0]+0.8, ty);
      doc.setFontSize(fs);
      doc.text(f.lines, cb[1]+0.8, ty, {lineHeightFactor: lh/(fs*0.3528)});
      doc.text(numTxt(it.cantidad), cb[3]-0.8, ty, {align:"right"});
      doc.text(Number(it.kg)>0 ? numTxt(it.kg) : "-", cb[4]-0.8, ty, {align:"right"});
      doc.text(Number(it.precio).toFixed(2), cb[5]-0.8, ty, {align:"right"});
      doc.text(subtotalItem(it, !venta.redondeo).toFixed(2), cb[6]-0.8, ty, {align:"right"});
      ry += f.h;
      if(idx < filas.length-1) doc.line(x, ry, x+w, ry);
    });
    y = tableTop + tableH + 7;
    row("TOTAL", fmt(venta.total), 11, true);
    y += 0.5;
    doc.setLineWidth(0.1); doc.line(x, y-3.4, x+w, y-3.4); y += 1;
    pagoLineas(venta).forEach(function(r){ row(r[0], r[1]); });

    if(venta.notas){
      y+=1.5; doc.setFont("courier","normal"); doc.setFontSize(8.5);
      var nl = doc.splitTextToSize(venta.notas, w);
      doc.text(nl, x, y); y += nl.length*3.6;
    }
    y += 3;
    doc.setFont("courier","normal"); doc.setFontSize(8.5);
    var pieLines = [];
    pieLineas().forEach(function(l){ pieLines = pieLines.concat(doc.splitTextToSize(l, w)); });
    doc.text(pieLines, x+w/2, y, {align:"center"});
    y += pieLines.length*3.8;
    return y;
  }

  function buildTicketPdfBlob(venta, logoDataUrl, direccionTexto){
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor) return null;
    var doc = new jsPDFCtor({ unit:"mm", format:[80, ticketHeightMm(venta, logoDataUrl, direccionTexto)] });
    drawTicketOnDoc(doc, venta, logoDataUrl, direccionTexto);
    return doc.output("blob");
  }

  function buildMultiTicketPdfBlob(ventas, logoDataUrl, direcciones){
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor || !ventas.length) return null;
    var doc = new jsPDFCtor({ unit:"mm", format:[80, ticketHeightMm(ventas[0], logoDataUrl, direcciones && direcciones[0])] });
    ventas.forEach(function(v, i){
      if(i>0) doc.addPage([80, ticketHeightMm(v, logoDataUrl, direcciones && direcciones[i])]);
      drawTicketOnDoc(doc, v, logoDataUrl, direcciones && direcciones[i]);
    });
    return doc.output("blob");
  }

  function conLogoDataUrl(){
    return state.negocio.logo ? loadImageAsDataUrl(state.negocio.logo).catch(function(){ return null; }) : Promise.resolve(null);
  }

  var pdfListo = { id:null, blob:null };
  function prepararPdfTicket(venta){
    pdfListo = { id:venta.id||venta.correlativo, blob:null };
    var clave = pdfListo.id;
    var dirP = venta.ubicacion ? reverseGeocode(venta.ubicacion) : Promise.resolve(null);
    Promise.all([conLogoDataUrl(), dirP]).then(function(res){
      var blob = buildTicketPdfBlob(venta, res[0], res[1]);
      if(pdfListo.id===clave) pdfListo.blob = blob;
    }).catch(function(){});
  }

  function compartirPdfTicket(venta){
    var nombre = "nota_"+String(venta.correlativo).padStart(6,"0")+".pdf";
    function enviar(blob){
      if(!blob){ alert("No se pudo preparar el PDF. Intenta de nuevo en unos segundos."); return; }
      var file = new File([blob], nombre, { type:"application/pdf" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:"Nota de venta N° "+String(venta.correlativo).padStart(6,"0") }).catch(function(err){
          if(err && err.name!=="AbortError") triggerDownload(nombre, blob);
        });
      } else {
        triggerDownload(nombre, blob);
      }
    }
    if(pdfListo.blob && pdfListo.id===(venta.id||venta.correlativo)) enviar(pdfListo.blob);
    else alert("Preparando el PDF, toca Compartir de nuevo en 2 segundos.");
  }

  function descargarPdfTicket(venta){
    var direccionPromise = venta.ubicacion ? reverseGeocode(venta.ubicacion) : Promise.resolve(null);
    Promise.all([conLogoDataUrl(), direccionPromise]).then(function(res){
      var logoDataUrl = res[0], direccionTexto = res[1];
      var blob = buildTicketPdfBlob(venta, logoDataUrl, direccionTexto);
      if(!blob){ alert("No se pudo preparar el PDF. Intenta de nuevo en unos segundos."); return; }
      triggerDownload("nota_"+String(venta.correlativo).padStart(6,"0")+".pdf", blob);
    });
  }

  // ---------- ticket & settings overlays ----------

  function pagoLineas(v){
    var L = [];
    if(v.tipoPago!=="credito"){
      L.push(["Pago","Al contado"]);
      L.push(["Método",metodoLabel(v.metodoPago)]);
      return L;
    }
    var ab = abonosEfectivos(v);
    if(!ab.length){
      L.push(["Estado","Pendiente de pago"]);
      L.push(["Debe el total",fmt(v.total)]);
      return L;
    }
    ab.forEach(function(a){ L.push(["Pagó ("+metodoLabel(a.metodo)+")",fmt(a.monto)]); });
    var saldo = saldoPendiente(v);
    if(saldo>0) L.push(["Saldo pendiente",fmt(saldo)]);
    else L.push(["Estado","Pagado completo"]);
    return L;
  }

  function estadoPagoHtml(venta){
    var texto;
    if(venta.tipoPago==="credito"){
      if(venta.pagado){
        texto = '<strong>Pagado completo</strong> — '+fmt(venta.total)+' por '+metodoLabel(venta.metodoPago)+'.';
      } else if(esPagoParcial(venta)){

  // Impresion "justa": la nota se pasa a un marco oculto con el mismo estilo de impresion (80 mm),
  // se mide su alto real y se fija el tamaño de la hoja a ese alto. Asi cabe todo, sin cortes ni hojas de mas,
  // sean 2 o 20 productos.
  function crearMarcoTicket(cuandoListo){
    var tk = document.querySelector("#overlay-root .ticket");
    if(!tk){ cuandoListo(null, 0); return; }
    var css = Array.prototype.map.call(document.querySelectorAll("style"), function(st){ return st.textContent; }).join("\n");
    var ini = css.indexOf("@media print{"), reglasImpresion = "";
    if(ini > -1){
      var j = ini + 13, prof = 1;
      while(j < css.length && prof > 0){ var ch = css.charAt(j); if(ch==="{") prof++; else if(ch==="}") prof--; j++; }
      reglasImpresion = css.slice(ini + 13, j - 1);
    }
    var base = css.replace(/@page\s*\{[^}]*\}/, "");
    var fr = document.createElement("iframe");
    fr.setAttribute("aria-hidden", "true");
    fr.style.cssText = "position:fixed;left:-10000px;top:0;width:80mm;height:4000px;border:0;visibility:hidden;";
    document.body.appendChild(fr);
    var d = fr.contentWindow.document;
    d.open();
    d.write('<!doctype html><html><head><meta charset="utf-8"><style>'+base+'</style><style>'+reglasImpresion+'</style><style>.overlay{position:static !important;inset:auto !important;height:auto !important;min-height:0 !important;overflow:visible !important;} #overlay-root{position:static !important;} .modal{margin:0 !important;max-height:none !important;overflow:visible !important;} body{overflow:visible !important;}</style><style id="pg"></style></head>'
      + '<body><div id="overlay-root"><div class="overlay"><div class="modal">'+tk.outerHTML+'</div></div></div></body></html>');
    d.close();
    var terminado = false;
    function medir(){
      if(terminado) return; terminado = true;
      var t = d.querySelector(".ticket");
      var px = t ? t.getBoundingClientRect().bottom : 0;
      var mm = Math.max(40, Math.ceil(px * 25.4 / 96) + 1);
      d.getElementById("pg").textContent = "@page{ size:80mm "+mm+"mm; margin:0; }";
      cuandoListo(fr, mm);
    }
    var imgs = Array.prototype.slice.call(d.images || []);
    var pendientes = imgs.filter(function(im){ return !im.complete; }).length;
    if(!pendientes){ setTimeout(medir, 80); }
    else {
      imgs.forEach(function(im){ if(!im.complete){ im.onload = im.onerror = function(){ if(--pendientes<=0) setTimeout(medir, 50); }; } });
      setTimeout(medir, 2500);
    }
  }

  function imprimirTicketAjustado(){
    crearMarcoTicket(function(fr){
      if(!fr){ window.print(); return; }
      var w = fr.contentWindow;
      var limpiar = function(){ setTimeout(function(){ if(fr.parentNode) fr.parentNode.removeChild(fr); }, 500); };
      w.onafterprint = limpiar;
      setTimeout(limpiar, 120000);
      try{ w.focus(); w.print(); }catch(e){ limpiar(); window.print(); }
    });
  }

  // ---------- impresion directa por Bluetooth (BLE) a la impresora termica de 80 mm ----------
  // La nota se dibuja en un canvas (mismo diseño del PDF), se convierte a puntos blanco/negro (203 dpi)
  // y se envia a la impresora con CPCL o TSPL. No necesita la app del fabricante ni modo recibo.

  function uuid16(n){ return "0000" + n.toString(16).padStart(4, "0") + "-0000-1000-8000-00805f9b34fb"; }
  var BT_SERVICIOS = [0xff00, 0xffe0, 0xfff0, 0xfee7, 0x18f0, 0xae30, 0xaf30, 0xff12, 0xfe59, 0xffb0, 0xfea0].map(uuid16).concat([
    "49535343-fe7d-4ae5-8fa9-9fafd205e455", "e7810a71-73ae-499d-8c15-faa9aef0c3f2", "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"]);
  var btPrinter = { device:null, char:null };
  var BT_KEY_LANG = "lr_printer_lang_v1";
  function btLang(){ var v = ""; try{ v = localStorage.getItem(BT_KEY_LANG) || ""; }catch(e){} return (v==="TSPL" || v==="CPCL") ? v : "ESCPOS"; }

  function btDisponible(){ return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }

  function btMensajeNoDisponible(){
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
    return ios
      ? "Safari en iPhone no permite conectarse a impresoras Bluetooth desde una página web.\n\nSolución: instala gratis el navegador \"Bluefy\" (App Store), abre Rutipollo desde ahí (contaplanix.github.io/rutipollo/), inicia sesión y toca \"Imprimir directo\"."
      : "Este navegador no permite Bluetooth desde la página. Abre Rutipollo en Google Chrome (Android) y vuelve a intentar.";
  }

  function btEstado(txt){
    var el = document.getElementById("bt-status");
    if(el) el.textContent = txt || "";
    var el2 = document.getElementById("bt-status-ajustes");
    if(el2) el2.textContent = txt || "";
  }

  function etapa(nombre, promesa){
    return Promise.resolve(promesa).catch(function(e){
      var err = new Error((e && e.message) || String(e));
      err.name = (e && e.name) || "Error";
      err.etapa = nombre;
      err.original = e;
      throw err;
    });
  }

  // Busca un canal donde escribir. Primero pide todos los servicios; si el navegador no lo permite (Bluefy),
  // prueba uno por uno con la lista de servicios conocidos.
  function btBuscarCanal(server, info){
    function mejor(chs){
      return chs.find(function(ch){ return ch.properties.writeWithoutResponse; }) || chs.find(function(ch){ return ch.properties.write; }) || null;
    }
    function deServicio(svc){
      info.push("servicio "+svc.uuid);
      return svc.getCharacteristics().then(function(chs){
        chs.forEach(function(ch){
          var p = []; ["read","write","writeWithoutResponse","notify"].forEach(function(k){ if(ch.properties[k]) p.push(k); });
          info.push("  "+ch.uuid+" ["+p.join(",")+"]");
        });
        return mejor(chs);
      }).catch(function(e){ info.push("  (sin acceso: "+((e && e.message) || e)+")"); return null; });
    }
    return server.getPrimaryServices().then(function(servicios){
      var elegido = null;
      return servicios.reduce(function(prev, svc){
        return prev.then(function(){ if(elegido) return; return deServicio(svc).then(function(c){ if(c) elegido = c; }); });
      }, Promise.resolve()).then(function(){ return elegido; });
    }).catch(function(e){
      info.push("getPrimaryServices falló: "+((e && e.message) || e));
      return null;
    }).then(function(encontrado){
      if(encontrado) return encontrado;
      var elegido = null;
      return BT_SERVICIOS.reduce(function(prev, uuid){
        return prev.then(function(){
          if(elegido) return;
          return server.getPrimaryService(uuid).then(deServicio).then(function(c){ if(c) elegido = c; }).catch(function(){});
        });
      }, Promise.resolve()).then(function(){ return elegido; });
    });
  }

  var btUltimaInfo = [];

  // Prueba varias formas de pedir la impresora, porque cada navegador acepta unas distintas.
  function pedirDispositivo(info){
    var intentos = [
      ["todos + servicios", { acceptAllDevices:true, optionalServices:BT_SERVICIOS }],
      ["nombre HQ300 + servicios", { filters:[{ namePrefix:"HQ300" }], optionalServices:BT_SERVICIOS }],
      ["todos + servicio FF00", { acceptAllDevices:true, optionalServices:[uuid16(0xff00)] }]
    ];
    var i = 0;
    function probar(){
      var it = intentos[i];
      return navigator.bluetooth.requestDevice(it[1]).catch(function(e){
        var nombre = e && e.name;
        if(nombre === "NotFoundError") throw e; // el usuario cerro la lista
        info.push("intento '" + it[0] + "' falló: " + ((e && e.message) || e));
        i++;
        if(i < intentos.length) return probar();
        throw e;
      });
    }
    return probar();
  }

  function btConectar(){
    if(btPrinter.char && btPrinter.device && btPrinter.device.gatt && btPrinter.device.gatt.connected) return Promise.resolve(btPrinter.char);
    var info = []; btUltimaInfo = info;
    var pedir = btPrinter.device ? Promise.resolve(btPrinter.device)
      : etapa("elegir impresora", pedirDispositivo(info));
    return pedir.then(function(dev){
      btPrinter.device = dev;
      dev.addEventListener("gattserverdisconnected", function(){ btPrinter.char = null; });
      btEstado("Conectando con "+(dev.name||"la impresora")+"…");
      info.push("dispositivo "+(dev.name||"sin nombre"));
      return etapa("conectar", dev.gatt.connect());
    }).then(function(server){
      return etapa("buscar canal", btBuscarCanal(server, info));
    }).then(function(elegido){
      if(!elegido){
        var err = new Error("La impresora no muestra un canal de escritura conocido.");
        err.etapa = "buscar canal";
        throw err;
      }
      btPrinter.char = elegido;
      return elegido;
    });
  }

  function btEnviar(ch, bytes){
    var chunk = 180, i = 0;
    var sinResp = !!ch.properties.writeWithoutResponse && !!ch.writeValueWithoutResponse;
    var total = bytes.length;
    function esperar(){ return new Promise(function(r){ setTimeout(r, sinResp ? 12 : 0); }); }
    function paso(){
      if(i >= total) return Promise.resolve();
      var parte = bytes.slice(i, i+chunk);
      var w = sinResp ? ch.writeValueWithoutResponse(parte) : ch.writeValue(parte);
      return w.then(function(){
        i += parte.length;
        btEstado("Enviando… "+Math.round(i*100/total)+"%");
        return esperar();
      }, function(e){
        if(chunk > 20){ chunk = chunk > 100 ? 100 : 20; return null; }
        throw e;
      }).then(paso);
    }
    return paso();
  }

  // Un "doc" de canvas con la misma interfaz minima que usa drawTicketOnDoc (jsPDF), en milimetros.
  function CanvasDoc(anchoMm, altoMm){
    this.k = 8; // puntos por mm (203 dpi)
    this.c = document.createElement("canvas");
    this.c.width = Math.round(anchoMm * this.k);
    this.c.height = Math.max(1, Math.round(altoMm * this.k));
    this.ctx = this.c.getContext("2d");
    this.ctx.fillStyle = "#fff"; this.ctx.fillRect(0, 0, this.c.width, this.c.height);
    this.ctx.fillStyle = "#000"; this.ctx.strokeStyle = "#000"; this.ctx.textBaseline = "alphabetic";
    this.size = 9; this.bold = false; this.lw = 0.2; this.logoImg = null; this.imgs = [];
  }
  CanvasDoc.prototype = {
    setFont: function(n, st){ this.bold = st === "bold"; return this; },
    setFontSize: function(pt){ this.size = pt; return this; },
    setLineWidth: function(w){ this.lw = w; return this; },
    _font: function(){
      this.ctx.font = (this.bold ? "bold " : "") + (this.size * 25.4 / 72 * this.k) + 'px "Courier New", "Liberation Mono", Courier, monospace';
    },
    getTextWidth: function(t){ this._font(); return this.ctx.measureText(String(t)).width / this.k; },
    splitTextToSize: function(t, maxW){
      var self = this, out = [];
      String(t).split("\n").forEach(function(par){
        var words = par.split(/\s+/).filter(Boolean), cur = "";
        words.forEach(function(w){
          var prueba = cur ? cur + " " + w : w;
          if(!cur || self.getTextWidth(prueba) <= maxW) cur = prueba; else { out.push(cur); cur = w; }
        });
        out.push(cur);
      });
      return out;
    },
    text: function(t, x, y, o){
      o = o || {};
      this._font();
      var self = this, ctx = this.ctx, k = this.k;
      var lines = Array.isArray(t) ? t : String(t).split("\n");
      if(o.maxWidth && !Array.isArray(t)) lines = this.splitTextToSize(String(t), o.maxWidth);
      var paso = this.size * 25.4 / 72 * (o.lineHeightFactor || 1.15);
      ctx.textAlign = o.align === "right" ? "right" : (o.align === "center" ? "center" : "left");
      lines.forEach(function(l, i){ ctx.fillText(String(l), x * k, (y + i * paso) * k); });
    },
    line: function(x1, y1, x2, y2){
      var ctx = this.ctx, k = this.k;
      ctx.lineWidth = Math.max(1, Math.round(this.lw * k));
      ctx.beginPath(); ctx.moveTo(x1 * k, y1 * k); ctx.lineTo(x2 * k, y2 * k); ctx.stroke();
    },
    rect: function(x, y, w, h){
      var ctx = this.ctx, k = this.k;
      ctx.lineWidth = Math.max(1, Math.round(this.lw * k));
      ctx.strokeRect(x * k, y * k, w * k, h * k);
    },
    addImage: function(src, fmt, x, y, w, h){
      if(!this.logoImg) return;
      var k = this.k;
      this.ctx.drawImage(this.logoImg, x * k, y * k, w * k, h * k);
      this.imgs.push({ x:Math.round(x*k), y:Math.round(y*k), w:Math.round(w*k), h:Math.round(h*k) });
    }
  };

  var BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

  // Recorta 72 mm centrados (576 puntos) y pasa a 1 bit por punto (1 = negro). El logo se tramea; el texto se umbraliza.
  function canvasABits(cd){
    var W = 576, x0 = Math.floor((cd.c.width - W) / 2), H = cd.c.height, bpr = W / 8;
    var data = cd.ctx.getImageData(x0, 0, W, H).data;
    var bits = new Uint8Array(bpr * H);
    var esLogo = function(px, py){
      for(var i = 0; i < cd.imgs.length; i++){
        var r = cd.imgs[i];
        if(px + x0 >= r.x && px + x0 < r.x + r.w && py >= r.y && py < r.y + r.h) return true;
      }
      return false;
    };
    for(var yy = 0; yy < H; yy++){
      for(var xx = 0; xx < W; xx++){
        var p = (yy * W + xx) * 4;
        var lum = 0.299 * data[p] + 0.587 * data[p+1] + 0.114 * data[p+2];
        var umbral = 150;
        if(cd.imgs.length && esLogo(xx, yy)) umbral = (BAYER4[yy % 4][xx % 4] + 0.5) / 16 * 255;
        if(lum < umbral) bits[yy * bpr + (xx >> 3)] |= (0x80 >> (xx & 7));
      }
    }
    return { bits:bits, w:W, h:H, bpr:bpr };
  }

  function ascii(s){ var a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; }
  function unir(partes){
    var n = 0; partes.forEach(function(p){ n += p.length; });
    var out = new Uint8Array(n), o = 0;
    partes.forEach(function(p){ out.set(p, o); o += p.length; });
    return out;
  }

  function comandoImpresion(r, lang){
    if(lang === "ESCPOS"){
      // Modo recibo (ESC/POS): imagen por bandas con GS v 0, y avance de papel al final.
      var partes = [new Uint8Array([0x1b, 0x40, 0x1b, 0x61, 0x00])];
      var banda = 240;
      for(var y0 = 0; y0 < r.h; y0 += banda){
        var hh = Math.min(banda, r.h - y0);
        partes.push(new Uint8Array([0x1d, 0x76, 0x30, 0x00, r.bpr & 255, (r.bpr >> 8) & 255, hh & 255, (hh >> 8) & 255]));
        partes.push(r.bits.slice(y0 * r.bpr, (y0 + hh) * r.bpr));
      }
      partes.push(new Uint8Array([0x1b, 0x64, 0x04]));
      return unir(partes);
    }
    if(lang === "TSPL"){
      var inv = new Uint8Array(r.bits.length);
      for(var i = 0; i < r.bits.length; i++) inv[i] = r.bits[i] ^ 0xff; // en TSPL 0 = negro
      var mm = Math.ceil(r.h / 8);
      return unir([
        ascii("SIZE 80 mm,"+mm+" mm\r\nGAP 0 mm,0 mm\r\nDIRECTION 0\r\nCLS\r\nBITMAP 32,0,"+r.bpr+","+r.h+",0,"),
        inv,
        ascii("\r\nPRINT 1,1\r\n")
      ]);
    }
    return unir([
      ascii("! 0 200 200 "+r.h+" 1\r\nPAGE-WIDTH "+r.w+"\r\nCG "+r.bpr+" "+r.h+" 0 0 "),
      r.bits,
      ascii("\r\nFORM\r\nPRINT\r\n")
    ]);
  }

  function cargarImagen(src){
    return new Promise(function(res){
      if(!src){ res(null); return; }
      var im = new Image();
      im.onload = function(){ res(im); };
      im.onerror = function(){ res(null); };
      im.src = src;
    });
  }

  // Dibuja la nota en un canvas: primero se mide, luego se dibuja con el alto exacto.
  function notaACanvasDoc(venta, logoImg, direccionTexto){
    var medida = new CanvasDoc(80, 10); medida.logoImg = logoImg;
    var alto = drawTicketOnDoc(medida, venta, logoImg ? "logo" : null, direccionTexto) + 12;
    var cd = new CanvasDoc(80, alto); cd.logoImg = logoImg;
    drawTicketOnDoc(cd, venta, logoImg ? "logo" : null, direccionTexto);
    return cd;
  }

  function enviarAImpresora(cd){
    var r = canvasABits(cd);
    var bytes = comandoImpresion(r, btLang());
    return btConectar().then(function(ch){ return etapa("enviar", btEnviar(ch, bytes)); }).then(function(){ btEstado("Enviado a la impresora ✓"); });
  }

  function btErrorTexto(e){
    var m = (e && e.message) || String(e);
    var t = (e && e.etapa) ? "[" + e.etapa + "] " : "";
    t += ((e && e.name && e.name !== "Error") ? e.name + ": " : "") + m;
    if(btUltimaInfo && btUltimaInfo.length) t += "\n\n" + btUltimaInfo.slice(0, 14).join("\n");
    t += "\n\nSi la impresora sigue conectada a la app del fabricante, desconéctala y ciérrala antes de volver a intentar.";
    return t;

    if(!btDisponible()){ alert(btMensajeNoDisponible()); return; }
    btEstado("Preparando la nota…");

      if(e && e.name === "NotFoundError") return;
      alert("No se pudo imprimir: "+btErrorTexto(e));

  function addDaysISO(iso, days){
    var p = iso.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
    d.setUTCDate(d.getUTCDate()+days);
    return d.toISOString().slice(0,10);
  }

      if(confirm("¿Cambiar de usuario?")) logout();
    }
    else if(action==="agregar-usuario"){
      if(!esAdmin(currentUser)) return;
      var unombre = document.getElementById("nu-nombre").value.trim();
      var upin = document.getElementById("nu-pin").value.trim();
      if(!unombre){ alert("Ingresa el nombre del usuario."); return; }
      if(state.usuarios.some(function(u){ return u.nombre.trim().toLowerCase()===unombre.toLowerCase(); })){ alert("Ya existe un usuario con ese nombre."); return; }
      if(!/^\d{4}$/.test(upin)){ alert("El PIN debe tener exactamente 4 dígitos."); return; }
      var upass = document.getElementById("nu-pass").value;
      if(upass.length < 8){ alert("La contraseña debe tener al menos 8 caracteres."); return; }
      var umail = emailDeNombre(unombre);
      if(!umail){ alert("El nombre debe tener letras o números."); return; }
      // Cuenta nueva en una segunda conexion, para no cerrar la sesion del administrador.
      var sec = firebase.apps.find(function(a){ return a.name==="alta"; }) || firebase.initializeApp(window.RUTIPOLLO_FIREBASE_CONFIG, "alta");
      sec.auth().createUserWithEmailAndPassword(umail, upass).then(function(cred){
        var nuevoUid = cred.user.uid;
        return sec.auth().signOut().then(function(){
          saveUsuario({ id:nuevoUid, nombre:unombre, pin:upin, rol:"vendedor", authEmail:umail });
          openAjustes();
        });
      }).catch(function(err){
        alert(err && err.code==="auth/email-already-in-use" ? "Ya existe una cuenta con ese nombre." : "No se pudo crear el usuario. Revisa tu internet.");
      });
    }
    else if(action==="eliminar-usuario"){
      if(!esAdmin(currentUser)) return;
      if(confirm("¿Eliminar este usuario? Perderá el acceso de inmediato.")){
        deleteUsuario(t.getAttribute("data-id"));
        openAjustes();
      }
    }
    else if(action==="agregar-cliente"){
      var ncNombre = document.getElementById("nc-nombre").value.trim();
      if(!ncNombre){ alert("Ingresa el nombre del cliente."); return; }
      var ncId = t.getAttribute("data-id");
      if(ncId){
        var ce = state.clientes.find(function(c){return c.id===ncId;});
        saveCliente(Object.assign({}, ce, { nombre: ncNombre }));
      } else {
        saveCliente({ nombre: ncNombre });
      }
      ui.editingClienteId = null;
      renderTab();
    }
    else if(action==="editar-cliente"){ ui.editingClienteId = t.getAttribute("data-id"); renderTab(); }
    else if(action==="cancelar-edicion-cliente"){ ui.editingClienteId = null; renderTab(); }
    else if(action==="eliminar-cliente"){
      if(confirm("¿Eliminar este cliente de la lista? Sus notas de venta ya registradas no se borran.")){
        deleteCliente(t.getAttribute("data-id"));
        ui.editingClienteId = null;
        renderTab();
      }
    }
    else if(action==="gate-volver"){ logout(); }
    else if(action==="confirmar-login"){
      var nomVal = document.getElementById("gate-nombre").value.trim();
      var passVal = document.getElementById("gate-password").value;
      ui.gateNombre = nomVal;
      var mail = emailDeNombre(nomVal);
      if(!mail || !passVal){ ui.gateError = "Escribe tu nombre y tu contraseña."; renderGate(); return; }
      if(!state.db || !window.firebase || !firebase.auth){ ui.gateError = "Sin conexión. Conéctate a internet para iniciar sesión."; renderGate(); return; }
      ui.gateError = "Verificando…";
      renderGate();
      firebaseSignIn(mail, passVal).then(function(cred){
        var uid = cred.user.uid;
        return state.db.doc("usuarios/"+uid).get().then(function(snap){
          if(!snap.exists){
            firebaseSignOut();
            ui.gateError = "Tu usuario no está autorizado. Habla con un administrador.";
            renderGate();
            return;
          }
          var yo = Object.assign({}, snap.data(), { id:snap.id, _synced:true });
          state.usuarios = [yo]; persist("usuarios");
          try{ localStorage.setItem("lr_last_name_v1", yo.nombre); }catch(e){}
          ui.gateSelectedId = yo.id; ui.gateMode = "pin"; ui.gateError = ""; ui.gateNombre = "";
          renderGate();
        });
      }).catch(function(err){
        var code = err && err.code || "";
        ui.gateError = code==="auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos e inténtalo de nuevo."
          : code==="auth/network-request-failed" ? "Sin conexión. Revisa tu internet."
          : "Nombre o contraseña incorrectos.";
        renderGate();
      });
    }
    else if(action==="confirmar-pin"){
      var pinVal = document.getElementById("gate-pin").value.trim();
      var su = state.usuarios.find(function(x){ return x.id===ui.gateSelectedId; });
      if(su && su.pin === pinVal){ ui.gateError = ""; loginAs(su); }
      else { ui.gateError = "PIN incorrecto."; renderGate(); }
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var id = e.target && e.target.id;
    if(id==="gate-pin"){ e.preventDefault(); document.querySelector('[data-action="confirmar-pin"]').click(); }
    else if(id==="gate-password"){ e.preventDefault(); document.querySelector('[data-action="confirmar-login"]').click(); }
    else if(id==="gate-nombre"){ e.preventDefault(); var pw = document.getElementById("gate-password"); if(pw) pw.focus(); }
    else if(id==="nu-pin" || id==="nu-nombre" || id==="nu-pass"){ e.preventDefault(); document.querySelector('[data-action="agregar-usuario"]').click(); }
  });

  document.addEventListener("input", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("item-input")){
      var idx = Number(t.getAttribute("data-idx"));
      var field = t.getAttribute("data-field");
      if(!draft.items[idx]) return;
      draft.items[idx][field] = field==="producto" ? t.value : Number(t.value);
      if(field==="producto") delete draft.items[idx].codigo;
      var sub = subtotalItem(draft.items[idx]);
      var subEl = document.getElementById("subtotal-"+idx);
      if(subEl) subEl.textContent = fmt(sub);
      var totalEl = document.getElementById("draft-total");
      if(totalEl) totalEl.textContent = fmt(draftTotal());
      if(field==="producto") showProductoSuggestions(idx, t.value);
    }
    else if(t.id==="f-cliente"){ showClienteSuggestions(t.value); }
    else if(t.id==="productos-buscar"){
      ui.productosBuscar = t.value;
      var contP = document.getElementById("productos-filas");
      if(contP) contP.innerHTML = productosFilasHtml();
    }
    else if(t.id==="clientes-buscar"){
      ui.clientesBuscar = t.value;
      var contC = document.getElementById("clientes-lista");
      if(contC) contC.innerHTML = clientesListaHtml();
    }
    else if(t.id==="cobrar-buscar"){
      ui.cobrarBuscar = t.value;
      var cont = document.getElementById("cobrar-lista");
      if(cont) cont.innerHTML = cobrarListaHtml(state.ventas.filter(estaPendiente).filter(function(v){ return !ui.soloMisVentas || !currentUser || v.vendedor===currentUser.nombre; }));
    }
  });

  document.addEventListener("focusin", function(e){
    var t = e.target;
    if(t.id==="f-cliente"){ showClienteSuggestions(t.value); }
    else if(t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto"){
      showProductoSuggestions(Number(t.getAttribute("data-idx")), t.value);
    }
  });

  document.addEventListener("focusout", function(e){
    var t = e.target;
    if(t.id==="f-cliente" || (t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto")){
      setTimeout(hideAllSuggestions, 180);
    }
  });

  document.addEventListener("change", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("sel-check")){
      var vid = t.getAttribute("data-id");
      if(t.checked) ui.selected[vid] = true; else delete ui.selected[vid];
      var btn = document.querySelector('[data-action="eliminar-seleccionadas"]');
      if(btn){
        var n = Object.keys(ui.selected).filter(function(id){return ui.selected[id];}).length;
        btn.textContent = "Eliminar ("+n+")";
        btn.disabled = n===0;
      }
    }
    else if(t.id==="bt-lang"){ try{ localStorage.setItem(BT_KEY_LANG, t.value); }catch(e){} }
    else if(t.id==="hist-year"){ ui.historialYear = Number(t.value); ui.selectMode=false; ui.selected={}; renderTab(); }
    else if(t.id==="resumen-dia-picker"){ ui.resumenDiaSel = t.value; renderTab(); }
    else if(t.classList && t.classList.contains("item-input") && t.getAttribute("data-field")==="producto"){
      var idx = Number(t.getAttribute("data-idx"));
      var match = state.productos.find(function(p){ return p.nombre.trim().toLowerCase()===t.value.trim().toLowerCase(); });
      if(match && (!draft.items[idx].precio || draft.items[idx].precio===0)){
        draft.items[idx].precio = match.precio;
        var precioInput = document.querySelector('input[data-field="precio"][data-idx="'+idx+'"]');
        if(precioInput) precioInput.value = match.precio;
        var sub = subtotalItem(draft.items[idx]);
        var subEl = document.getElementById("subtotal-"+idx);
        if(subEl) subEl.textContent = fmt(sub);
        var totalEl = document.getElementById("draft-total");
        if(totalEl) totalEl.textContent = fmt(draftTotal());
      }
    }
    else if(t.id==="f-fecha"){ draft.fecha = t.value; }
    else if(t.id==="f-cliente"){ draft.cliente = t.value; }
    else if(t.id==="f-notas"){ draft.notas = t.value; }
  });

  initStore();
})();
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
        reg.update().catch(function(){});
      }).catch(function(){});
    });
  }
</script>
</body>
</html>
