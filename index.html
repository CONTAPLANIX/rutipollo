<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rutipollo</title>
<meta name="description" content="Notas de venta Rico Pollo Dissur">
<meta name="theme-color" content="#f76204">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutipollo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --paper:#fbf4e9;
    --paper-alt:#f5e6d3;
    --paper-raised:#ffffff;
    --ink:#092d58;
    --ink-soft:#5c6f88;
    --line:#ecdac0;
    --line-strong:#d9b98f;
    --accent:#f76204;
    --accent-strong:#d14f02;
    --accent-ink:#ffffff;
    --danger:#c23b2c;
    --shadow-sm: 0 1px 2px rgba(9,45,88,.06), 0 1px 1px rgba(9,45,88,.05);
    --shadow: 0 8px 22px rgba(9,45,88,.10), 0 2px 6px rgba(9,45,88,.06);
    --shadow-lg: 0 20px 45px rgba(9,45,88,.16), 0 6px 16px rgba(9,45,88,.08);
    --focus: #092d58;
    --focus-ring: rgba(247,98,4,.22);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e1620;
      --paper-alt:#131d29;
      --paper-raised:#182432;
      --ink:#eef2f7;
      --ink-soft:#93a3b8;
      --line:#28394c;
      --line-strong:#3c5068;
      --accent:#ff7a1f;
      --accent-strong:#ff9245;
      --accent-ink:#1c0f03;
      --danger:#ff6b5a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow: 0 8px 22px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
      --shadow-lg: 0 20px 45px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.35);
      --focus:#ff9245;
      --focus-ring: rgba(255,122,31,.28);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1620;
    --paper-alt:#131d29;
    --paper-raised:#182432;
    --ink:#eef2f7;
    --ink-soft:#93a3b8;
    --line:#28394c;
    --line-strong:#3c5068;
    --accent:#ff7a1f;
    --accent-strong:#ff9245;
    --accent-ink:#1c0f03;
    --danger:#ff6b5a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 8px 22px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg: 0 20px 45px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.35);
    --focus:#ff9245;
    --focus-ring: rgba(255,122,31,.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; touch-action:pan-x pan-y; }
  html{ scrollbar-color: var(--line-strong) transparent; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:20px; border:2px solid var(--paper); }
  h1,h2,h3{ font-family:"Anton", "Arial Narrow", sans-serif; font-weight:400; letter-spacing:.03em; text-transform:uppercase; margin:0 0 4px; text-wrap:balance;}
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease); }
  button:active{ transform:scale(.97); }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

  .shell{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; border-bottom:1px solid var(--line);
    background:var(--paper-alt); position:sticky; top:0; z-index:15;
    box-shadow:var(--shadow-sm);
  }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-text{ display:flex; flex-direction:column; min-width:0; gap:1px; }
  .brand-text strong{ font-family:"Anton","Arial Narrow",sans-serif; font-size:17px; font-weight:400; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
  .brand-logo{ width:40px; height:40px; object-fit:contain; flex:none; border-radius:10px; background:var(--paper-raised); padding:3px; box-shadow:var(--shadow-sm); }
  .sync-badge{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex:none; box-shadow:0 0 0 3px transparent; transition:box-shadow .2s var(--ease); }
  .sync-dot.ok{ background:#3f8f5f; box-shadow:0 0 0 3px rgba(63,143,95,.18); }
  .sync-dot.warn{ background:#c98a2e; box-shadow:0 0 0 3px rgba(201,138,46,.18); }
  .icon-btn{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); width:38px; height:38px; font-size:16px; box-shadow:var(--shadow-sm); }
  .icon-btn:hover{ background:var(--paper); border-color:var(--line-strong); }
  button.sync-badge{ background:transparent; border:none; padding:3px 6px; margin:0; font:inherit; border-radius:6px; }
  button.sync-badge:hover{ background:var(--paper-raised); }
  .pending-mark{ color:var(--accent); font-weight:600; }

  .body{ flex:1; display:flex; min-height:0; }
  .tabbar{ display:flex; gap:2px; background:var(--paper-alt); border-top:1px solid var(--line); z-index:20; box-shadow:0 -6px 16px rgba(9,45,88,.08); }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; padding:9px 4px 8px; font-size:10.5px; font-weight:500; color:var(--ink-soft);
    border-top:2px solid transparent; position:relative;
  }
  .tab-btn .ic{ font-size:18px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
  .tab-btn .ic svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; transition:transform .18s var(--ease); }
  .tab-btn.active{ color:var(--accent); border-top-color:var(--accent); }
  .tab-btn.active .ic svg{ transform:translateY(-1px) scale(1.06); }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active:hover{ color:var(--accent); }
  .main{ flex:1; min-width:0; padding:18px; padding-bottom:92px; max-width:980px; margin:0 auto; width:100%; }

  @media (min-width:860px){
    .body{ flex-direction:row; }
    .tabbar{ position:sticky; top:61px; align-self:flex-start; flex-direction:column; width:224px; height:calc(100vh - 61px);
      border-top:none; border-right:1px solid var(--line); padding:16px 10px; gap:3px; box-shadow:none; }
    .tab-btn{ flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 14px; font-size:14px; border-top:none; border-left:none; border-radius:var(--r-sm); }
    .tab-btn.active{ background:var(--paper-raised); box-shadow:var(--shadow-sm); }
    .tab-btn.active .ic svg{ transform:none; }
    .tab-btn:hover{ background:rgba(9,45,88,.05); }
    .main{ padding:28px 32px; padding-bottom:32px; }
  }
  @media (max-width:859px){
    .tabbar{ position:fixed; bottom:0; left:0; right:0; padding-bottom:env(safe-area-inset-bottom); }
  }

  .section-title{ font-size:21px; margin-bottom:3px; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; line-height:1.5; }

  .today-strip{ display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,var(--paper-alt),var(--paper)); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 18px; margin-bottom:18px; font-size:14px; box-shadow:var(--shadow-sm); }
  .today-strip .amt{ font-weight:600; color:var(--accent); font-size:17px; }

  .backup-hint{ display:flex; justify-content:space-between; align-items:center; gap:12px; background:transparent; border:1px dashed var(--line-strong); border-radius:var(--r-md); padding:11px 16px; margin-bottom:18px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; }

  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); padding:18px; box-shadow:var(--shadow); }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .field input, .field textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; font-size:15px; color:var(--ink);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .field input:focus, .field textarea:focus{ border-color:var(--focus); box-shadow:0 0 0 3.5px var(--focus-ring); }
  .field input::placeholder, .field textarea::placeholder{ color:var(--ink-soft); opacity:.65; }

  .ac-wrap{ position:relative; }
  .ac-list{ position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--r-md); max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; z-index:40; box-shadow:var(--shadow-lg); animation:popIn .14s var(--ease); }
  .ac-item{ padding:10px 13px; font-size:14px; border-bottom:1px dashed var(--line); transition:background-color .12s var(--ease); }
  .ac-item:last-child{ border-bottom:none; }
  .ac-item:hover, .ac-item:active{ background:var(--paper-alt); }
  .ac-item .sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  .ac-list.ac-list-overlay{ position:fixed !important; left:auto; right:auto; margin-top:0; }
  .ac-list-overlay .ac-item{ padding:15px 18px; font-size:16px; }
  .ac-list-overlay .ac-item .sub{ font-size:13px; margin-top:3px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .pay-toggle{ display:flex; gap:8px; flex-wrap:wrap; }
  .pay-opt{ flex:1 1 100px; text-align:center; border:1px solid var(--line); background:var(--paper); border-radius:var(--r-sm); padding:10px 10px; font-size:14px; font-weight:500; color:var(--ink-soft); }
  .pay-opt:hover{ border-color:var(--line-strong); }
  .pay-opt.on{ background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 4px 12px rgba(247,98,4,.28); }
  .pay-opt.yape{ border-color:#a276c4; color:#742284; }
  .pay-opt.yape.on{ background:#742284; border-color:#5c1a69; color:#fff; box-shadow:0 4px 12px rgba(116,34,132,.35); }
  .pay-opt.plin{ border-color:#7fe0d8; color:#049a91; }
  .pay-opt.plin.on{ background:#00c1b6; border-color:#049a91; color:#06322f; box-shadow:0 4px 12px rgba(0,193,182,.35); }
  .pay-tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:2.5px 8px; border-radius:20px; border:1px solid var(--line-strong); color:var(--ink-soft); white-space:nowrap; font-weight:600; }
  .pay-tag.efectivo{ background:var(--paper-alt); }
  .pay-tag.banco{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pay-tag.yape{ background:#742284; color:#fff; border-color:#742284; }
  .pay-tag.plin{ background:#00c1b6; color:#06322f; border-color:#00c1b6; }
  .pay-tag.mixto{ background:var(--paper-alt); color:var(--ink); border-color:var(--line-strong); }
  .pay-tag.pendiente{ background:transparent; color:var(--danger); border-color:var(--danger); font-weight:600; }
  .pay-tag.parcial{ background:transparent; color:#b8790a; border-color:#b8790a; font-weight:600; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); padding:10px 18px; border-radius:var(--r-sm); font-size:14px; font-weight:500; box-shadow:var(--shadow-sm); }
  .btn:hover{ background:var(--paper-alt); border-color:var(--line-strong); }
  .btn-primary{ background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 4px 14px rgba(247,98,4,.32); }
  .btn-primary:hover{ background:var(--accent-strong); box-shadow:0 6px 18px rgba(247,98,4,.4); }
  .btn-danger{ color:var(--danger); border-color:var(--danger); background:transparent; box-shadow:none; }
  .btn-danger:hover{ background:rgba(194,59,44,.08); }
  .abono-monto{ width:88px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:7px 8px; font-size:13.5px; color:var(--ink); text-align:right; }
  .abono-monto:focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--focus-ring); }
  .btn.yape{ border-color:#742284; color:#742284; }
  .btn.yape:hover{ background:rgba(116,34,132,.1); }
  .btn.plin{ border-color:#049a91; color:#049a91; }
  .btn.plin:hover{ background:rgba(0,193,182,.12); }
  .btn-ghost{ border-color:transparent; background:transparent; padding:6px 8px; box-shadow:none; }
  .btn-ghost:hover{ background:rgba(9,45,88,.06); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; }

  .items-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-sm); }
  table{ width:100%; border-collapse:collapse; min-width:520px; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; color:var(--ink-soft); padding:10px 12px; background:var(--paper-alt); border-bottom:1px solid var(--line); }
  tbody td{ padding:10px 12px; border-bottom:1px dashed var(--line); vertical-align:middle; }
  tbody tr{ transition:background-color .14s var(--ease); }
  tbody tr:hover{ background:var(--paper-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  td input{ width:100%; background:transparent; border:none; border-bottom:1px solid transparent; padding:5px 2px; font-size:14px; color:var(--ink); }
  td input:focus{ border-bottom-color:var(--focus); }
  .col-cant{ width:78px; } .col-kg{ width:84px; } .col-precio{ width:110px; } .col-sub{ width:110px; } .col-del{ width:38px; }
  /* En celular cada producto es una tarjeta: nombre arriba y Cant / Kg / P.unit / Importe abajo, todo visible. */
  @media (max-width:700px){
    table.items-form{ min-width:0; }
    .items-form thead{ display:none; }
    .items-form tbody tr{ display:grid; grid-template-columns:1fr 1fr 1fr 1.25fr; gap:8px 10px; padding:12px 12px 14px; position:relative; border-bottom:1px dashed var(--line); }
    .items-form tbody td{ display:block; width:auto !important; padding:0; border:none; }
    .items-form tbody td:first-child{ grid-column:1 / -1; padding-right:34px; }
    .items-form td[data-label]::before{ content:attr(data-label); display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:2px; }
    .items-form td.col-del{ position:absolute; top:8px; right:8px; }
    .items-form td.col-sub{ font-size:15px; font-weight:700; color:var(--accent); align-self:end; padding-bottom:6px; white-space:nowrap; }
    .items-form td input{ font-size:16px; border-bottom:1px solid var(--line); padding:6px 2px; }
  }
  .total-row{ display:flex; justify-content:flex-end; align-items:baseline; gap:10px; padding:14px 4px 4px; font-size:15px; }
  .total-row .amt{ font-size:22px; color:var(--accent); font-weight:600; }
  .actions-row{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .empty{ color:var(--ink-soft); font-size:14px; padding:26px 4px; text-align:center; }

  details.month{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease); }
  details.month[open]{ box-shadow:var(--shadow); }
  details.month summary{ list-style:none; cursor:pointer; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; font-family:"Anton","Arial Narrow",sans-serif; font-size:15px; }
  details.month summary:hover{ background:var(--paper-alt); }
  details.month summary::-webkit-details-marker{ display:none; }
  details.month summary .chev{ font-family:"IBM Plex Sans",sans-serif; color:var(--ink-soft); font-size:12px; transition:transform .2s var(--ease); }
  details.month[open] summary .chev{ transform:rotate(180deg); }
  details.month[open] summary{ border-bottom:1px solid var(--line); background:var(--paper-alt); }
  .month-total{ color:var(--accent); font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:600; }
  .day-block{ padding:10px 18px 6px; }
  .day-head{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin:10px 0 5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .note-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 6px; border-bottom:1px dashed var(--line); gap:10px; border-radius:6px; transition:background-color .14s var(--ease); }
  .note-row:hover{ background:var(--paper-alt); }
  .note-row:last-child{ border-bottom:none; }
  .note-row .who{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-row .corr{ color:var(--ink-soft); font-size:12px; }
  .note-row .amt{ font-family:"IBM Plex Mono",monospace; font-weight:600; white-space:nowrap; }
  .note-row .go{ background:transparent; border:none; color:var(--accent); font-size:12.5px; font-weight:600; text-decoration:underline; padding:2px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  @media (max-width:480px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-md); padding:16px 18px; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease), transform .18s var(--ease); }
  .stat:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
  .stat[data-action]{ cursor:pointer; }
  .stat[data-action]:hover{ border-color:var(--line-strong); }
  .stat[data-action]::after{ content:"Ver detalle ›"; display:block; font-size:10px; color:var(--ink-soft); margin-top:6px; opacity:.7; }
  .stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .stat .value{ font-family:"IBM Plex Mono",monospace; font-size:25px; margin-top:5px; font-weight:600; }
  .stat.hi{ border-color:var(--line-strong); }
  .stat.hi .value{ color:var(--accent); }

  .chart-card{ padding:16px 10px 8px; }
  .bar-label{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--ink-soft); }
  .bar-value{ font-family:"IBM Plex Mono",monospace; font-size:10px; fill:var(--ink); }
  .bar-rect{ fill:var(--accent); }
  .axis-line{ stroke:var(--line); stroke-width:1; }

  .prod-table td, .prod-table th{ font-size:14px; }
  .cliente-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 0; border-bottom:1px dashed var(--line); }
  .cliente-row:last-child{ border-bottom:none; }
  .cliente-nombre{ font-size:14.5px; font-weight:500; overflow-wrap:anywhere; min-width:0; flex:1 1 160px; }
  .cliente-acciones{ display:flex; gap:8px; flex:none; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  select.year-select{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; font-size:14px; box-shadow:var(--shadow-sm); }

  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{ width:36px; height:36px; flex:none; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--paper-raised); font-size:16px; color:var(--ink); box-shadow:var(--shadow-sm); }
  .stepper button:hover{ border-color:var(--accent); color:var(--accent); }
  .stepper .stepper-label{ min-width:118px; text-align:center; font-weight:600; font-family:"IBM Plex Mono",monospace; font-size:14px; }

  .overlay{ position:fixed; inset:0; background:rgba(12,10,6,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:26px 14px; overflow-y:auto; z-index:60; animation:fadeIn .16s var(--ease); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
  .modal{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px; width:100%; max-width:420px; box-shadow:var(--shadow-lg); animation:popIn .18s var(--ease); }
  .modal h2{ font-size:18px; margin-bottom:16px; }

  .ticket{ background:var(--paper-raised); width:100%; max-width:340px; margin:0 auto; padding:20px 18px; border-top:2px dashed var(--line-strong); border-bottom:2px dashed var(--line-strong); font-family:"IBM Plex Mono",monospace; border-radius:2px; }
  .ticket .biz-logo{ display:block; width:150px; height:150px; object-fit:contain; margin:0 auto 8px; }
  .ticket .biz{ text-align:center; font-family:"Anton","Arial Narrow",sans-serif; font-size:17px; margin-bottom:2px; }
  .ticket .biz-sub{ text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .ticket .doc-title{ text-align:center; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px; }
  .ticket .corr-stamp{ text-align:center; color:var(--accent); font-size:20px; font-weight:600; transform:rotate(-2deg); margin:4px 0 10px; }
  .ticket .meta{ display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:2px; }
  .ticket .meta span:first-child{ flex-shrink:0; }
  .ticket .meta span:last-child{ min-width:0; text-align:right; overflow-wrap:anywhere; }
  .ticket .ubic-block{ font-size:11px; margin:6px 0 2px; padding-top:4px; border-top:1px dashed var(--line); }
  .ticket .ubic-block strong{ display:block; margin-bottom:2px; }
  .ticket .ubic-block div{ color:var(--ink-soft); line-height:1.4; }
  .ticket .ubic-block a{ display:inline-block; margin-top:3px; font-size:10.5px; color:var(--accent); }
  .ticket hr{ border:none; border-top:1px dashed var(--line); margin:10px 0; }
  .ticket table.tk-items{ width:100%; min-width:0; border-collapse:collapse; table-layout:fixed; margin:3px 0 4px; font-size:10px; border:1px solid var(--ink); }
  .ticket .tk-moneda{ font-size:10.5px; font-weight:700; margin-top:10px; }
  .ticket .tk-items th, .ticket .tk-items td{ border:1px solid var(--ink); padding:4px 3px; text-align:right; vertical-align:middle; background:transparent; white-space:nowrap; letter-spacing:0; text-transform:none; color:var(--ink); }
  .ticket .tk-items th{ font-size:9px; font-weight:700; text-transform:uppercase; }
  .ticket .tk-items .l{ text-align:left; }
  .ticket .tk-items td.l:nth-child(2){ white-space:normal; overflow-wrap:break-word; }
  .ticket .tk-items tbody tr:hover{ background:transparent; }
  .ticket .tk-items col.c-cod{ width:15%; } .ticket .tk-items col.c-prod{ width:24%; } .ticket .tk-items col.c-cant{ width:11%; } .ticket .tk-items col.c-kg{ width:14%; } .ticket .tk-items col.c-pu{ width:16%; } .ticket .tk-items col.c-tot{ width:20%; }
  .ticket .it{ display:flex; justify-content:space-between; font-size:12.5px; gap:8px; margin-bottom:5px; }
  .ticket .it .nm{ min-width:0; overflow-wrap:anywhere; }
  .ticket .it .qp{ color:var(--ink-soft); font-size:11px; }
  .ticket .total{ display:flex; justify-content:space-between; font-size:16px; font-weight:600; margin-top:10px; }
  .ticket .pago-bloque{ margin-top:8px; padding-top:6px; border-top:1px dashed var(--line); }
  .ticket .foot{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:14px; }
  .ticket .legal{ text-align:center; font-size:9.5px; color:var(--ink-soft); margin-top:6px; }
  .ticket-actions{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }

  .internal-note{ background:var(--paper-alt); border:1px dashed var(--line-strong); border-radius:var(--r-sm); padding:10px 14px; margin-top:14px; font-size:12.5px; line-height:1.5; }
  .internal-note .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
  .internal-note .txt{ color:var(--ink); }

  .gate{ position:fixed; inset:0; background:radial-gradient(circle at 50% 0%, var(--paper-alt), var(--paper) 60%); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px; gap:22px; text-align:center; animation:fadeIn .2s var(--ease); }
  .gate-logo{ width:92px; height:92px; object-fit:contain; filter:drop-shadow(0 10px 20px rgba(9,45,88,.18)); }
  .gate-note{ color:var(--ink-soft); font-size:12.5px; max-width:320px; line-height:1.5; }
  .user-grid{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:460px; }
  .user-chip{ padding:16px 24px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--paper-raised); font-size:15px; font-weight:600; min-width:112px; color:var(--ink); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .user-chip::before{ content:attr(data-initial); width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:"Anton","Arial Narrow",sans-serif; font-size:15px; }
  .user-chip:hover{ border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-2px); }
  .pin-pad{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .pin-input{ font-size:30px; letter-spacing:16px; text-align:center; width:180px; padding:12px 0 12px 16px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper-raised); color:var(--ink); font-family:"IBM Plex Mono",monospace; box-shadow:var(--shadow-sm); }
  .pin-input:focus{ border-color:var(--focus); box-shadow:0 0 0 4px var(--focus-ring); }
  .pin-error{ color:var(--danger); font-size:13px; min-height:16px; font-weight:500; }
  .gate-form{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px; }
  .gate-form input{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px 14px; font-size:15px; color:var(--ink); text-align:center; box-shadow:var(--shadow-sm); }
  .gate-form input:focus{ border-color:var(--focus); box-shadow:0 0 0 3.5px var(--focus-ring); }

  @page{ size:80mm auto; margin:0; }
  @media print{
    html, body{ width:80mm; margin:0; padding:0; background:#fff !important; }
    .overlay{ padding:0 !important; background:#fff !important; backdrop-filter:none !important; display:block !important; }
    .modal{ box-shadow:none !important; border:none !important; padding:0 !important; max-width:80mm !important; width:80mm !important; border-radius:0 !important; animation:none !important; }
    .ticket{ width:72mm !important; max-width:72mm !important; margin:0 auto !important; padding:3mm 0 12mm !important; color:#000 !important; background:#fff !important; border-top:none !important; border-bottom:none !important; }
    .ticket *{ color:#000 !important; }
    .ticket .biz-logo{ width:34mm !important; height:34mm !important; margin-bottom:2mm !important; }
    .ticket .biz-sub{ font-size:9pt !important; margin-bottom:1mm !important; }
    .ticket .doc-title{ font-size:10pt !important; }
    .ticket .corr-stamp{ font-size:15pt !important; transform:none !important; margin:1mm 0 3mm !important; }
    .ticket .meta{ font-size:9.5pt !important; margin-bottom:1mm !important; gap:3mm; }
    .ticket .meta span:last-child{ text-align:right; overflow-wrap:anywhere; }
    .ticket hr{ border-top:1px solid #000 !important; margin:2.5mm 0 !important; }
    .ticket table.tk-items{ font-size:7pt !important; border:0.3mm solid #000 !important; }
    .ticket .tk-items th, .ticket .tk-items td{ border:0.25mm solid #000 !important; padding:1mm 0.6mm !important; }
    .ticket .tk-items th{ font-size:6pt !important; }
    .ticket .it{ font-size:9.5pt !important; margin-bottom:1.8mm !important; gap:3mm !important; }
    .ticket .it > div:last-child{ white-space:nowrap; font-weight:600; }
    .ticket .it .qp{ font-size:8.5pt !important; }
    .ticket .total{ font-size:12pt !important; margin-top:2mm !important; }
    .ticket .pago-bloque{ border-top:1px solid #000 !important; margin-top:2mm !important; padding-top:2mm !important; }
    .ticket .foot{ font-size:9pt !important; margin-top:3mm !important; }
    .ticket .ubic-block{ font-size:8.5pt !important; }
    .ticket .ubic-block a{ display:none !important; }
    body *{ visibility:hidden; }
    #overlay-root, #overlay-root *{ visibility:visible; }
    #overlay-root{ position:absolute; inset:0; background:#fff !important; padding:0; }
    .ticket-actions{ display:none !important; }
    .internal-note{ display:none !important; }
    .ticket{ border:none; max-width:100%; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Rico Pollo Dissur">
      <div class="brand-text">
        <strong id="negocio-nombre">Rico Pollo Dissur</strong>
        <button class="sync-badge" id="sync-badge" data-action="sincronizar-ahora" title="Tocar para sincronizar ahora"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Cargando…</span></button>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn btn-sm" id="user-badge" data-action="cambiar-usuario" style="display:none;" title="Cambiar de usuario"></button>
      <button class="icon-btn" data-action="abrir-ajustes" title="Configuración" aria-label="Configuración" style="display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="tabbar" id="tabbar">
      <button class="tab-btn active" data-tab="nueva"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span>Nueva venta</span></button>
      <button class="tab-btn" data-tab="historial"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg></span><span>Historial</span></button>
      <button class="tab-btn" data-tab="resumen"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span>Resumen</span></button>
      <button class="tab-btn" data-tab="cobrar"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span><span>Deudores</span></button>
      <button class="tab-btn" data-tab="productos"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span><span>Productos</span></button>
      <button class="tab-btn" data-tab="clientes"><span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Clientes</span></button>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="overlay-root"></div>

<script>
(function(){
  "use strict";

  var MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var MESES_ABR = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  var state = {
    tab: "nueva",
    ventas: [],
    productos: [],
    clientes: [],
    usuarios: [],
    negocio: { nombre: "Rico Pollo Dissur", telefono: "", pie: "Gracias por su Compra. ¡Hasta la próxima entrega!", logo: "assets/logo.png" },
    db: null,
    dbReady: false
  };

  var draft = { fecha: todayISO(), cliente: "", notas: "", tipoPago: "contado", metodoPago: "efectivo", items: [ blankItem() ] };
  var ui = { historialYear: (new Date()).getFullYear(), resumenYear: (new Date()).getFullYear(), resumenMonth: 0, resumenVista: "dias", resumenDiaSel: null, editingProductoId: null, editingClienteId: null, selectMode: false, selected: {},
    gateMode: "login", gateSelectedId: null, gateError: "", soloMisVentas: false,
    cobrarVista: "pendientes", cobrarBuscar: "", clientesBuscar: "", productosBuscar: "", cobrarYear: (new Date()).getFullYear(), cobrarMonth: (new Date()).getMonth()+1 };

  var LS = { ventas:"lr_ventas_v1", productos:"lr_productos_v1", clientes:"lr_clientes_v1", negocio:"lr_negocio_v1", pending:"lr_pending_deletes_v1", usuarios:"lr_usuarios_v1", currentUser:"lr_current_user_v1", lastBackup:"lr_last_backup_v1" };
  var pendingDeletes = { ventas:[], productos:[], clientes:[], usuarios:[] };
  var syncTimer = null;
  var currentUser = null;
  var editingVentaId = null;
  var currentTicketVenta = null;

  function blankItem(){ return { producto:"", cantidad:1, kg:"", precio:0 }; }
  // Si la fila tiene kilogramos, el precio es por kilo; si no, es por unidad (cantidad).
  // Redondeo a 10 centimos (0.05 sube): 306.85 -> 306.90. Se aplica a cada producto y al total.
  function redondear10(x){
    var c = Math.round((Number(x)||0)*100 + 1e-7);
    return Math.round(c/10)/10;
  }
  // sinRedondeo=true solo para notas emitidas antes de que existiera el redondeo.
  function subtotalItem(i, sinRedondeo){
    var kg = Number(i.kg)||0;
    var crudo = (kg>0 ? kg : (Number(i.cantidad)||0)) * (Number(i.precio)||0);
    return sinRedondeo ? crudo : redondear10(crudo);
  }
  var MONEDA_NOMBRE = "SOLES";
  // Mensaje del pie en lineas centradas: "Gracias por su Compra" / "¡Hasta la próxima entrega!"
  function pieLineas(){
    var t = String(state.negocio.pie || "Gracias por su Compra. ¡Hasta la próxima entrega!");
    return t.split(/\n|\.\s+/).map(function(x){ return x.trim().replace(/\.$/, ""); }).filter(Boolean);
  }
  function numTxt(n){ return String(Number((Number(n)||0).toFixed(3))); }

  function genId(prefix){ return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }

  function todayISO(){
    var d = new Date();
    var tz = d.getTimezoneOffset();
    var local = new Date(d.getTime() - tz*60000);
    return local.toISOString().slice(0,10);
  }

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmt(n){
    n = Number(n)||0;
    return "S/ " + n.toLocaleString("es-PE", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function parseFecha(f){
    var p = String(f).split("-").map(Number);
    return { anio:p[0], mes:p[1], dia:p[2] };
  }

  function fechaDisplay(f){
    var p = parseFecha(f);
    return p.dia + " " + MESES_ABR[p.mes-1] + " " + p.anio;
  }

  function metodoLabel(m){
    return m==="banco" ? "Banco" : m==="yape" ? "Yape" : m==="plin" ? "Plin" : m==="mixto" ? "Mixto" : "Efectivo";
  }
  function metodoAbrev(m){
    return m==="banco" ? "Banco" : m==="yape" ? "Yape" : m==="plin" ? "Plin" : m==="mixto" ? "Mixto" : "Efvo.";
  }
  function metodoTagClass(m){
    return m==="banco" ? "banco" : m==="yape" ? "yape" : m==="plin" ? "plin" : m==="mixto" ? "mixto" : "efectivo";
  }
  function payTagHtml(v){
    if(estaPendiente(v)){
      return esPagoParcial(v)
        ? '<span class="pay-tag parcial" title="Abonado '+fmt(montoAbonado(v))+' de '+fmt(v.total)+'">Abono parcial</span>'
        : '<span class="pay-tag pendiente">Pendiente</span>';
    }
    return '<span class="pay-tag '+metodoTagClass(v.metodoPago)+'">'+metodoAbrev(v.metodoPago)+'</span>';
  }
  function cobradoVenta(v, metodo){
    if(v.tipoPago==="credito"){
      return abonosEfectivos(v).reduce(function(s,a){ return s + (metodoTagClass(a.metodo)===metodo ? (Number(a.monto)||0) : 0); }, 0);
    }
    return (estaPagado(v) && metodoTagClass(v.metodoPago)===metodo) ? Number(v.total)||0 : 0;
  }
  function cobradoTotal(ventas, metodo){
    return ventas.reduce(function(s,v){ return s + cobradoVenta(v, metodo); }, 0);
  }

  function abrirDetalleCobros(titulo, ventas, metodo){
    var rows = ventas.length ? ventas.map(function(v){
      if(!metodo) return notaRowHtml(v);
      var parcial = v.tipoPago==="credito" && cobradoVenta(v, metodo) < v.total - 0.009;
      return '<div class="note-row"><div class="who"><span class="corr">N° '+String(v.correlativo).padStart(6,"0")+'</span> — '+escapeHtml(v.cliente)+(parcial ? ' <span style="color:var(--ink-soft);font-size:11.5px;">(abono de '+fmt(v.total)+')</span>' : '')+'</div>'
        + '<div style="display:flex;align-items:center;gap:8px;"><span class="pay-tag '+metodoTagClass(metodo)+'">'+metodoAbrev(metodo)+'</span><span class="amt">'+fmt(cobradoVenta(v, metodo))+'</span>'
        + '<button class="go" data-action="ver-venta" data-id="'+v.id+'">ver</button></div></div>';
    }).join("") : '<p class="empty">Sin notas en este periodo.</p>';
    var root = document.getElementById("overlay-root");
    root.innerHTML = '<div class="overlay" data-action="cerrar-overlay">'
      + '  <div class="modal">'
      + '    <h2>'+escapeHtml(titulo)+'</h2>'
      + '    <div style="max-height:60vh;overflow-y:auto;">'+rows+'</div>'
      + '    <div class="actions-row"><button class="btn" data-action="cerrar-overlay">Cerrar</button></div>'
      + '  </div>'
      + '</div>';
  }

  function abrirDetallePendientes(ventas){
    var completos = ventas.filter(function(v){ return montoAbonado(v) <= 0.009; });
    var parciales = ventas.filter(function(v){ return montoAbonado(v) > 0.009; });
    function filaPendiente(v, esParcial){
      var monto = esParcial ? saldoPendiente(v) : v.total;
      var sub = esParcial ? ' <span style="color:var(--ink-soft);font-size:11.5px;">(de '+fmt(v.total)+')</span>' : '';
      return '<div class="note-row"><div class="who"><span class="corr">N° '+String(v.correlativo).padStart(6,"0")+'</span> — '+escapeHtml(v.cliente)+'</div>'
        + '<div style="display:flex;align-items:center;gap:8px;"><span class="amt" style="color:var(--danger);">'+fmt(monto)+'</span>'+sub+'<button class="go" data-action="ver-venta" data-id="'+v.id+'">ver</button></div></div>';
    }
    var html = '<h3 style="font-size:12.5px;margin:14px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;">Deben el total de la nota ('+completos.length+')</h3>'
      + (completos.length ? completos.map(function(v){return filaPendiente(v,false);}).join("") : '<p class="empty">Ninguna.</p>')
      + '<h3 style="font-size:12.5px;margin:18px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;">Deben solo un saldo ('+parciales.length+')</h3>'
      + (parciales.length ? parciales.map(function(v){return filaPendiente(v,true);}).join("") : '<p class="empty">Ninguna.</p>');
    var root = document.getElementById("overlay-root");
    root.innerHTML = '<div class="overlay" data-action="cerrar-overlay">'

  function poolResumenPorScope(scope){

    if(scope==="month") return groupByYear(ui.resumenYear).filter(function(v){ return v.mes===ui.resumenMonth; });
    if(scope==="cobrar") return state.ventas.filter(function(v){ return !ui.soloMisVentas || !currentUser || v.vendedor===currentUser.nombre; });

  function horaDisplay(creadoEn){
    if(!creadoEn) return "";
    var d = new Date(creadoEn);
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h>=12 ? "p.m." : "a.m.";
    var h12 = h % 12; if(h12===0) h12 = 12;
    return h12 + ":" + String(m).padStart(2,"0") + " " + ampm;
  }

  // Notas de antes de esta función no tienen tipoPago/pagado guardado — se tratan
  // como "contado, ya pagado" (su comportamiento de siempre), sin migrar datos.
  function estaPagado(v){ return v.pagado !== false; }

  function abonosEfectivos(v){
    if(v.abonos && v.abonos.length) return v.abonos;
    if(v.pagado && v.fechaPago) return [{ monto:v.total, metodo:v.metodoPago, fecha:v.fechaPago }];
    return [];
  }
  function montoAbonado(v){
    return abonosEfectivos(v).reduce(function(s,a){ return s + (Number(a.monto)||0); }, 0);
  }
  function saldoPendiente(v){
    if(v.tipoPago!=="credito" || v.pagado) return 0;
    var s = Number(v.total||0) - montoAbonado(v);
    return s > 0.009 ? Math.round(s*100)/100 : 0;
  }
  function esPagoParcial(v){
    return v.tipoPago==="credito" && !v.pagado && montoAbonado(v) > 0.009;
  }
  function estaPendiente(v){ return v.tipoPago==="credito" && saldoPendiente(v) > 0; }

  function registrarAbono(v, monto, metodo){
    monto = Math.min(Number(monto)||0, saldoPendiente(v));
    if(monto <= 0) return false;
    if(!Array.isArray(v.abonos)) v.abonos = abonosEfectivos(v).slice();
    v.abonos.push({ monto: monto, metodo: metodo, fecha: todayISO() });
    var totalAbonado = v.abonos.reduce(function(s,a){ return s + (Number(a.monto)||0); }, 0);
    if(totalAbonado >= Number(v.total||0) - 0.009){
      v.pagado = true;
      v.fechaPago = todayISO();
      var metodosUsados = {};
      v.abonos.forEach(function(a){ metodosUsados[a.metodo] = true; });
      var keys = Object.keys(metodosUsados);
      v.metodoPago = keys.length===1 ? keys[0] : "mixto";
    }
    v._synced = false;
    persist("ventas");
    refreshSyncBadge();
    syncPending();
    return true;
  }

  function obtenerUbicacion(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function(){ resolve(null); },
        { timeout: 5000, maximumAge: 120000, enableHighAccuracy: false }
      );
    });
  }

  var geocodeCache = {};
  function reverseGeocode(ubicacion){
    var key = ubicacion.lat.toFixed(5)+","+ubicacion.lon.toFixed(5);
    if(geocodeCache[key]) return Promise.resolve(geocodeCache[key]);
    var url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+ubicacion.lat+"&lon="+ubicacion.lon+"&zoom=18&addressdetails=0";
    return fetch(url, { headers: { "Accept-Language": "es" } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var addr = d && d.display_name ? d.display_name : null;
        if(addr) geocodeCache[key] = addr;
        return addr;
      })
      .catch(function(){ return null; });
  }

  function codigoItem(it){ return it.codigo || codigoDeProducto(it.producto); }
  function codigoDeProducto(nombre){
    var n = String(nombre||"").trim().toLowerCase();
    var p = state.productos.find(function(x){ return x.nombre.trim().toLowerCase()===n; });
    return (p && p.codigo) ? p.codigo : "";

  // ---------- búsqueda de clientes / productos frecuentes ----------

  function clienteSuggestions(query){
    var counts = {};
    state.ventas.forEach(function(v){ if(v.cliente) counts[v.cliente] = (counts[v.cliente]||0)+1; });
    var names = {};
    state.clientes.forEach(function(c){ if(c.nombre) names[c.nombre]=true; });
    Object.keys(counts).forEach(function(n){ names[n]=true; });
    var list = Object.keys(names);
    var q = (query||"").trim().toLowerCase();
    if(q) list = list.filter(function(n){ return n.toLowerCase().indexOf(q)>-1; });
    list.sort(function(a,b){ return (counts[b]||0)-(counts[a]||0) || a.localeCompare(b); });
    return list.slice(0,8);
  }

  function productoSuggestions(query){
    var counts = {};
    state.ventas.forEach(function(v){ (v.items||[]).forEach(function(it){ counts[it.producto] = (counts[it.producto]||0)+1; }); });
    var byName = {};
    var nombresCatalogo = {};
    state.productos.forEach(function(p){ byName[(p.codigo||"")+"|"+p.nombre] = p; nombresCatalogo[p.nombre] = true; });
    Object.keys(counts).forEach(function(n){ if(!nombresCatalogo[n]) byName["|"+n] = { nombre:n }; });
    var list = Object.keys(byName).map(function(n){ return byName[n]; });
    var q = (query||"").trim().toLowerCase();
    if(q) list = list.filter(function(p){ return p.nombre.toLowerCase().indexOf(q)>-1 || (p.codigo && p.codigo.toLowerCase().indexOf(q)>-1); });
    function rangoCodigo(p){ var c = (p.codigo||"").toLowerCase(); return c===q ? 0 : (c.indexOf(q)===0 || c.replace(/^0+/,"").indexOf(q.replace(/^0+/,""))===0 && q ? 1 : 2); }
    if(q) list.sort(function(a,b){ return rangoCodigo(a)-rangoCodigo(b) || (counts[b.nombre]||0)-(counts[a.nombre]||0) || a.nombre.localeCompare(b.nombre); });
    else list.sort(function(a,b){ return a.nombre.localeCompare(b.nombre) || (a.codigo||"").localeCompare(b.codigo||""); });
    return list.slice(0, q ? 30 : 200);
  }

  // ---------- persistence ----------

  function loadLocal(){
    try{ state.ventas = JSON.parse(localStorage.getItem(LS.ventas) || "[]"); }catch(e){ state.ventas = []; }
    try{ state.productos = JSON.parse(localStorage.getItem(LS.productos) || "[]"); }catch(e){ state.productos = []; }
    try{ state.clientes = JSON.parse(localStorage.getItem(LS.clientes) || "[]"); }catch(e){ state.clientes = []; }
    try{ state.usuarios = JSON.parse(localStorage.getItem(LS.usuarios) || "[]"); }catch(e){ state.usuarios = []; }
    try{
      var neg = JSON.parse(localStorage.getItem(LS.negocio) || "null");
      if(neg) state.negocio = neg;
    }catch(e){}
    try{ pendingDeletes = JSON.parse(localStorage.getItem(LS.pending) || "null") || {ventas:[],productos:[],clientes:[],usuarios:[]}; }catch(e){ pendingDeletes = {ventas:[],productos:[],clientes:[],usuarios:[]}; }
    if(!pendingDeletes.usuarios) pendingDeletes.usuarios = [];
    if(!pendingDeletes.clientes) pendingDeletes.clientes = [];
    try{ currentUser = JSON.parse(localStorage.getItem(LS.currentUser) || "null"); }catch(e){ currentUser = null; }
  }
  function persist(key){
    try{ localStorage.setItem(LS[key], JSON.stringify(state[key])); }catch(e){}
  }
  function persistPending(){
    try{ localStorage.setItem(LS.pending, JSON.stringify(pendingDeletes)); }catch(e){}
  }

  function pendingCount(){
    return state.ventas.filter(function(v){return !v._synced;}).length
      + state.productos.filter(function(p){return !p._synced;}).length
      + pendingDeletes.ventas.length + pendingDeletes.productos.length;
  }

  function refreshSyncBadge(){
    var dot = document.getElementById("sync-dot");
    var txt = document.getElementById("sync-text");
    if(!dot) return;
    var online = navigator.onLine;
    var pend = pendingCount();
    if(!state.dbReady){
      dot.className = "sync-dot warn";
      txt.textContent = online ? "Solo en este equipo" : "Sin internet — guardado local";
    } else if(!online){
      dot.className = "sync-dot warn";
      txt.textContent = pend>0 ? ("Sin internet · "+pend+" por enviar") : "Sin internet — guardado local";
    } else if(pend>0){
      dot.className = "sync-dot warn";
      txt.textContent = "Sincronizando "+pend+"…";
    } else {
      dot.className = "sync-dot ok";
      txt.textContent = "Sincronizado";
    }
  }

  function applyNegocioHeader(){
    document.getElementById("negocio-nombre").textContent = state.negocio.nombre || "Rico Pollo Dissur";
  }

  // Cloud sync is a best-effort mirror of the last ~1000 notes (platform query cap),
  // never the full record — localStorage on each device holds the complete history.
  // So merging only ever ADDS/UPDATES from remote changes, or removes a doc that was
  // explicitly deleted (a real "removed" change) — it never prunes local data just
  // because an old note fell outside the cloud's query window.
  function mergeRemoteVentas(changes){
    changes.forEach(function(ch){
      if(ch.type==="removed"){
        state.ventas = state.ventas.filter(function(v){ return v.id!==ch.doc.id; });
      } else {
        var idx = state.ventas.findIndex(function(v){ return v.id===ch.doc.id; });
        var data = Object.assign({}, ch.doc.data(), { id:ch.doc.id, _synced:true });
        if(idx>-1) state.ventas[idx] = data; else state.ventas.push(data);
      }
    });
    state.ventas.sort(function(a,b){ return (b.creadoEn||0)-(a.creadoEn||0); });
    persist("ventas");
  }

  function mergeRemoteProductos(changes){
    changes.forEach(function(ch){
      if(ch.type==="removed"){
        state.productos = state.productos.filter(function(p){ return p.id!==ch.doc.id; });
      } else {
        var idx = state.productos.findIndex(function(p){ return p.id===ch.doc.id; });
        var data = Object.assign({}, ch.doc.data(), { id:ch.doc.id, _synced:true });
        if(idx>-1) state.productos[idx] = data; else state.productos.push(data);
      }
    });
    persist("productos");
  }

  function mergeRemoteClientes(changes){
    changes.forEach(function(ch){
      if(ch.type==="removed"){
        state.clientes = state.clientes.filter(function(c){ return c.id!==ch.doc.id; });
      } else {
        var idx = state.clientes.findIndex(function(c){ return c.id===ch.doc.id; });
        var data = Object.assign({}, ch.doc.data(), { id:ch.doc.id, _synced:true });
        if(idx>-1) state.clientes[idx] = data; else state.clientes.push(data);
      }
    });
    persist("clientes");
  }

  function syncPending(){
    if(!state.dbReady || !navigator.onLine) { refreshSyncBadge(); return; }
    var db = state.db;

    pendingDeletes.ventas.slice().forEach(function(id){
      db.doc("ventas/"+id).delete().then(function(){
        pendingDeletes.ventas = pendingDeletes.ventas.filter(function(x){return x!==id;});
        persistPending(); refreshSyncBadge();
      }).catch(function(){});
    });
    pendingDeletes.productos.slice().forEach(function(id){
      db.doc("productos/"+id).delete().then(function(){
        pendingDeletes.productos = pendingDeletes.productos.filter(function(x){return x!==id;});
        persistPending(); refreshSyncBadge();
      }).catch(function(){});
    });
    pendingDeletes.usuarios.slice().forEach(function(id){
      db.doc("usuarios/"+id).delete().then(function(){
        pendingDeletes.usuarios = pendingDeletes.usuarios.filter(function(x){return x!==id;});
        persistPending(); refreshSyncBadge();
      }).catch(function(){});
    });
    pendingDeletes.clientes.slice().forEach(function(id){
      db.doc("clientes/"+id).delete().then(function(){
        pendingDeletes.clientes = pendingDeletes.clientes.filter(function(x){return x!==id;});
        persistPending(); refreshSyncBadge();
      }).catch(function(){});
    });

    state.ventas.filter(function(v){ return !v._synced; }).forEach(function(v){
      var body = Object.assign({}, v); delete body.id; delete body._synced;
      db.doc("ventas/"+v.id).set(body).then(function(){
        v._synced = true; persist("ventas"); refreshSyncBadge();
      }).catch(function(){});
    });

    state.productos.filter(function(p){ return !p._synced; }).forEach(function(p){
      var body = Object.assign({}, p); delete body.id; delete body._synced;
      db.doc("productos/"+p.id).set(body).then(function(){
        p._synced = true; persist("productos"); refreshSyncBadge();
      }).catch(function(){});
    });

    state.usuarios.filter(function(u){ return !u._synced; }).forEach(function(u){
      var body = Object.assign({}, u); delete body.id; delete body._synced;
      db.doc("usuarios/"+u.id).set(body).then(function(){
        u._synced = true; persist("usuarios"); refreshSyncBadge();
      }).catch(function(){});
    });

    state.clientes.filter(function(c){ return !c._synced; }).forEach(function(c){
      var body = Object.assign({}, c); delete body.id; delete body._synced;
      db.doc("clientes/"+c.id).set(body).then(function(){
        c._synced = true; persist("clientes"); refreshSyncBadge();
      }).catch(function(){});
    });

    if(state.negocio._dirty){
      var nbody = Object.assign({}, state.negocio); delete nbody._dirty;
      db.doc("meta/negocio").set(nbody).then(function(){
        state.negocio._dirty = false; persist("negocio");
      }).catch(function(){});
    }
    refreshSyncBadge();
  }

  function initStore(){
    loadLocal();
    refreshSyncBadge();
    applyNegocioHeader();
    renderTab();
    checkGate();

    window.addEventListener("online", function(){ refreshSyncBadge(); syncPending(); });
    window.addEventListener("offline", refreshSyncBadge);
    syncTimer = setInterval(function(){ syncPending(); }, 25000);

    Promise.resolve()
      .then(function(){
        if(!window.RUTIPOLLO_FIREBASE_CONFIG || !window.RUTIPOLLO_FIREBASE_CONFIG.apiKey || !window.firebase) return null;
        if(!firebase.apps.length) firebase.initializeApp(window.RUTIPOLLO_FIREBASE_CONFIG);
        var fdb = firebase.firestore();
        return fdb.enablePersistence({ synchronizeTabs: true }).catch(function(){}).then(function(){ return fdb; });
      })
      .catch(function(){ return null; })
      .then(function(db){
        if(!db){ refreshSyncBadge(); return; }
        state.db = db;
        state.dbReady = true;

        var datosPrivadosConectados = false;
        function conectarDatosPrivados(uid){
          if(datosPrivadosConectados) return;
          datosPrivadosConectados = true;

          // Mi propio perfil (nombre, PIN, rol). Los administradores ademas ven la lista completa.
          var listaAdminConectada = false;
          db.doc("usuarios/"+uid).onSnapshot(function(snap){
            if(!snap.exists){
              if(currentUser) logout();
              return;
            }
            var yo = Object.assign({}, snap.data(), { id:snap.id, _synced:true });
            if(esAdmin(yo)){
              if(!listaAdminConectada){
                listaAdminConectada = true;
                db.collection("usuarios").orderBy("nombre","asc").limit(200).onSnapshot(function(ls){
                  aplicarUsuariosRemotos(ls.docs.map(function(d){ return Object.assign({}, d.data(), { id:d.id, _synced:true }); }), uid);
                }, function(){});
              }
            } else {
              aplicarUsuariosRemotos([yo], uid);
            }
          }, function(){});

          db.collection("ventas").orderBy("creadoEn","desc").limit(1000).onSnapshot(function(snap){
            mergeRemoteVentas(snap.docChanges());
            if(state.tab==="historial" || state.tab==="resumen") renderTab();
            refreshSyncBadge();
          }, function(){ refreshSyncBadge(); });

          db.collection("productos").orderBy("nombre","asc").limit(500).onSnapshot(function(snap){
            mergeRemoteProductos(snap.docChanges());
            if(state.tab==="productos" || state.tab==="nueva") renderTab();
            refreshSyncBadge();
          }, function(){});

          db.collection("clientes").orderBy("nombre","asc").limit(1000).onSnapshot(function(snap){
            mergeRemoteClientes(snap.docChanges());
            if(state.tab==="nueva") renderTab();
          }, function(){});

          db.doc("meta/negocio").onSnapshot(function(snap){
            if(snap.exists && !state.negocio._dirty){
              state.negocio = Object.assign({}, state.negocio, snap.data());
              applyNegocioHeader();
            }
          }, function(){});

          refreshSyncBadge();
          syncPending();
        }

        if(firebase.auth){
          firebase.auth().onAuthStateChanged(function(user){
            if(user) conectarDatosPrivados(user.uid);
            else if(currentUser) logout();
          });
        }

        refreshSyncBadge();
      });
  }

  function saveVenta(venta){
    venta.id = genId("v");
    venta._synced = false;
    state.ventas.unshift(venta);
    persist("ventas");
    openTicket(venta);
    refreshSyncBadge();
    syncPending();
  }

  function updateVenta(venta){
    var idx = state.ventas.findIndex(function(v){ return v.id===venta.id; });
    venta._synced = false;
    if(idx>-1) state.ventas[idx] = venta; else state.ventas.unshift(venta);
    persist("ventas");
    openTicket(venta);
    refreshSyncBadge();
    syncPending();
  }

    if(v && v._synced){ pendingDeletes.ventas.push(id); persistPending(); }

    refreshSyncBadge();
    syncPending();

  function saveCliente(c){
    if(c.id){
      var idx = state.clientes.findIndex(function(x){ return x.id===c.id; });
      c._synced = false;
      if(idx>-1) state.clientes[idx] = c; else state.clientes.push(c);
    } else {
      c.id = genId("c");
      c._synced = false;
      state.clientes.push(c);
    }
    persist("clientes");
    refreshSyncBadge();
    syncPending();
    return c;
  }

  function ensureCliente(nombre){
    var existe = state.clientes.some(function(c){ return c.nombre.trim().toLowerCase()===nombre.trim().toLowerCase(); });
    if(!existe) saveCliente({ nombre: nombre.trim() });
  }

  function deleteCliente(id){
    var c = state.clientes.find(function(x){ return x.id===id; });
    state.clientes = state.clientes.filter(function(x){ return x.id!==id; });
    persist("clientes");
    if(c && c._synced){ pendingDeletes.clientes.push(id); persistPending(); }
    refreshSyncBadge();
    syncPending();
  }

  function checkGate(){

  function aplicarUsuariosRemotos(lista, uid){
    state.usuarios = lista;
    persist("usuarios");
    var yo = lista.find(function(u){ return u.id===uid; });
    if(currentUser && yo){
      currentUser = { id:yo.id, nombre:yo.nombre, rol:yo.rol||"vendedor" };
      try{ localStorage.setItem(LS.currentUser, JSON.stringify(currentUser)); }catch(e){}

  function barChartSvg(labels, values, ariaLabel){
    var n = values.length;
    var max = Math.max.apply(null, values.concat([1]));
    var W=760,H=260,padL=36,padB=28,padT=14,barGap = n>15 ? 4 : 10;
    var chartW = W-padL-10, chartH = H-padT-padB;
    var bw = (chartW - barGap*(n-1))/n;
    var bars = "", labelsHtml = "";
    for(var i=0;i<n;i++){
      var h = max>0 ? (values[i]/max)*chartH : 0;
      var x = padL + i*(bw+barGap);
      var y = padT + (chartH-h);
      bars += '<rect class="bar-rect" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(bw,1).toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2"><title>'+labels[i]+": "+fmt(values[i])+'</title></rect>';
      if(values[i]>0 && (n<=12 || i%2===0)){
        bars += '<text class="bar-value" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+Math.round(values[i])+'</text>';
      }
      if(n<=12 || i%2===0){
        labelsHtml += '<text class="bar-label" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-padB+14).toFixed(1)+'" text-anchor="middle">'+labels[i]+'</text>';
      }
    }
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+ariaLabel+'">'
      + '<line class="axis-line" x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(W-8)+'" y2="'+(padT+chartH)+'"/>'
      + bars + labelsHtml + '</svg>';
  }

      var totalDia = ventasDia.reduce(function(s,v){return s+v.total;},0);
      var efvoDia = cobradoTotal(ventasDia, "efectivo");
      var bcoDia = cobradoTotal(ventasDia, "banco");
      var yapeDia = cobradoTotal(ventasDia, "yape");
      var plinDia = cobradoTotal(ventasDia, "plin");
      var cobrarDia = ventasDia.filter(estaPendiente).reduce(function(s,v){return s+saldoPendiente(v);},0);

      return ''

        + (!ventasDia.length ? '<p class="empty">Sin ventas registradas el '+fechaDisplay(diaSel)+'.</p>' : ''

          + '  <div class="stat hi"><div class="label">Total del día</div><div class="value">'+fmt(totalDia)+'</div></div>'
          + '  <div class="stat"><div class="label">Notas emitidas</div><div class="value">'+ventasDia.length+'</div></div>'
          + '  <div class="stat" data-action="detalle-metodo" data-metodo="efectivo" data-scope="day"><div class="label">Efectivo cobrado</div><div class="value" style="font-size:19px;">'+fmt(efvoDia)+'</div></div>'
          + '  <div class="stat" data-action="detalle-metodo" data-metodo="banco" data-scope="day"><div class="label">Banco cobrado</div><div class="value" style="font-size:19px;">'+fmt(bcoDia)+'</div></div>'
          + (yapeDia>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="yape" data-scope="day"><div class="label" style="color:#742284;">Yape</div><div class="value" style="font-size:19px;color:#742284;">'+fmt(yapeDia)+'</div></div>' : '')
          + (plinDia>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="plin" data-scope="day"><div class="label" style="color:#049a91;">Plin</div><div class="value" style="font-size:19px;color:#049a91;">'+fmt(plinDia)+'</div></div>' : '')

          + '</div>'
          + '<div class="card" style="padding:6px 16px;">'+filaDia+'</div>');
    }

    if(ui.resumenVista === "semanas"){
      var diasEnMesW = new Date(ui.resumenYear, ui.resumenMonth, 0).getDate();
      var semanas = [];
      var numSem = 1;
      for(var d0=1; d0<=diasEnMesW; d0+=7){ semanas.push({ num:numSem++, desde:d0, hasta:Math.min(d0+6, diasEnMesW), total:0, notas:0 }); }
      ventasMes.forEach(function(v){
        var s = semanas.find(function(s){ return v.dia>=s.desde && v.dia<=s.hasta; });
        if(s){ s.total+=v.total; s.notas+=1; }
      });
      var totalMesW = semanas.reduce(function(s,w){return s+w.total;},0);
      var notasMesW = semanas.reduce(function(s,w){return s+w.notas;},0);
      var efectivoMesW = cobradoTotal(ventasMes, "efectivo");
      var bancoMesW = cobradoTotal(ventasMes, "banco");
      var yapeMesW = cobradoTotal(ventasMes, "yape");
      var plinMesW = cobradoTotal(ventasMes, "plin");
      var porCobrarMesW = ventasMes.filter(estaPendiente).reduce(function(s,v){return s+saldoPendiente(v);},0);
      var svgSemanas = barChartSvg(semanas.map(function(w){return w.desde+"-"+w.hasta;}), semanas.map(function(w){return w.total;}), "Ingresos por semana en "+monthLabel);
      var bodySemanas = semanas.filter(function(w){return w.notas>0;}).map(function(w){
        var lista = ventasMes.filter(function(v){return v.dia>=w.desde && v.dia<=w.hasta;}).sort(function(a,b){return (a.creadoEn||0)-(b.creadoEn||0);});
        var rows = lista.map(notaRowHtml).join("");
        return '<details class="month" open><summary>Semana '+w.num+' ('+w.desde+'-'+w.hasta+' '+MESES_ABR[ui.resumenMonth-1]+') <span class="chev">▾</span> <span class="month-total">'+fmt(w.total)+'</span></summary><div class="day-block">'+rows+'</div></details>';
      }).join("");

      return ''
        + '<h1 class="section-title">Resumen de ingresos</h1>'
        + '<p class="section-sub">Detalle semanal de '+monthLabel+' '+ui.resumenYear+'.</p>'
        + toolbar
        + vistaToggle
        + (notasMesW===0 ? '<p class="empty">Sin ventas registradas en '+monthLabel+' '+ui.resumenYear+'.</p>' : ''
          + '<div class="stat-row">'
          + '  <div class="stat hi"><div class="label">Total del mes</div><div class="value">'+fmt(totalMesW)+'</div></div>'
          + '  <div class="stat"><div class="label">Notas emitidas</div><div class="value">'+notasMesW+'</div></div>'

          + (yapeMesW>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="yape" data-scope="month"><div class="label" style="color:#742284;">Yape cobrado</div><div class="value" style="font-size:19px;color:#742284;">'+fmt(yapeMesW)+'</div></div>' : '')
          + (plinMesW>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="plin" data-scope="month"><div class="label" style="color:#049a91;">Plin cobrado</div><div class="value" style="font-size:19px;color:#049a91;">'+fmt(plinMesW)+'</div></div>' : '')
          + (porCobrarMesW>0 ? '  <div class="stat" data-action="detalle-pendientes" data-scope="month"><div class="label">Por cobrar</div><div class="value" style="font-size:19px;color:var(--danger);">'+fmt(porCobrarMesW)+'</div></div>' : '')
          + '</div>'
          + '<div class="card chart-card">'+svgSemanas+'</div>'
          + bodySemanas);
    }

    var diasEnMes = new Date(ui.resumenYear, ui.resumenMonth, 0).getDate();
    var dayTotals = new Array(diasEnMes).fill(0);
    var dayCounts = new Array(diasEnMes).fill(0);
    ventasMes.forEach(function(v){ dayTotals[v.dia-1]+=v.total; dayCounts[v.dia-1]+=1; });
    var totalMes = dayTotals.reduce(function(a,b){return a+b;},0);
    var notasMes = ventasMes.length;
    var promedioDia = notasMes ? totalMes/dayTotals.filter(function(t){return t>0;}).length : 0;
    var efectivoMes = cobradoTotal(ventasMes, "efectivo");
    var bancoMes = cobradoTotal(ventasMes, "banco");
    var yapeMes = cobradoTotal(ventasMes, "yape");
    var plinMes = cobradoTotal(ventasMes, "plin");
    var porCobrarMes = ventasMes.filter(estaPendiente).reduce(function(s,v){return s+saldoPendiente(v);},0);
    var dayLabels = dayTotals.map(function(_,i){ return String(i+1); });
    var svgDia = barChartSvg(dayLabels, dayTotals, "Ingresos por día en "+monthLabel);
    var byDiaMes = {};
    ventasMes.forEach(function(v){ (byDiaMes[v.dia]=byDiaMes[v.dia]||[]).push(v); });
    var bodyDias = Object.keys(byDiaMes).map(Number).sort(function(a,b){return b-a;}).map(function(d){
      var lista = byDiaMes[d].slice().sort(function(a,b){return (a.creadoEn||0)-(b.creadoEn||0);});
      var dTotal = lista.reduce(function(s,v){return s+v.total;},0);
      var rows = lista.map(notaRowHtml).join("");
      return '<details class="month" open><summary>'+d+' '+MESES_ABR[ui.resumenMonth-1]+' <span class="chev">▾</span> <span class="month-total">'+fmt(dTotal)+'</span></summary><div class="day-block">'+rows+'</div></details>';
    }).join("");

    return ''
      + '<h1 class="section-title">Resumen de ingresos</h1>'
      + '<p class="section-sub">Detalle diario de '+monthLabel+' '+ui.resumenYear+'.</p>'
      + toolbar
      + vistaToggle
      + (notasMes===0 ? '<p class="empty">Sin ventas registradas en '+monthLabel+' '+ui.resumenYear+'.</p>' : ''
        + '<div class="stat-row">'
        + '  <div class="stat hi"><div class="label">Total del mes</div><div class="value">'+fmt(totalMes)+'</div></div>'
        + '  <div class="stat"><div class="label">Notas emitidas</div><div class="value">'+notasMes+'</div></div>'
        + '  <div class="stat"><div class="label">Promedio por día activo</div><div class="value" style="font-size:19px;">'+fmt(promedioDia)+'</div></div>'
        + '  <div class="stat" data-action="detalle-metodo" data-metodo="efectivo" data-scope="month"><div class="label">Efectivo cobrado</div><div class="value" style="font-size:19px;">'+fmt(efectivoMes)+'</div></div>'
        + '  <div class="stat" data-action="detalle-metodo" data-metodo="banco" data-scope="month"><div class="label">Banco cobrado</div><div class="value" style="font-size:19px;">'+fmt(bancoMes)+'</div></div>'
        + (yapeMes>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="yape" data-scope="month"><div class="label" style="color:#742284;">Yape cobrado</div><div class="value" style="font-size:19px;color:#742284;">'+fmt(yapeMes)+'</div></div>' : '')
        + (plinMes>0 ? '  <div class="stat" data-action="detalle-metodo" data-metodo="plin" data-scope="month"><div class="label" style="color:#049a91;">Plin cobrado</div><div class="value" style="font-size:19px;color:#049a91;">'+fmt(plinMes)+'</div></div>' : '')
        + (porCobrarMes>0 ? '  <div class="stat" data-action="detalle-pendientes" data-scope="month"><div class="label">Por cobrar</div><div class="value" style="font-size:19px;color:var(--danger);">'+fmt(porCobrarMes)+'</div></div>' : '')
        + '</div>'
        + '<div class="card chart-card">'+svgDia+'</div>'
        + bodyDias);
  }

  function filaAbono(v){
    var saldo = saldoPendiente(v);
    return '<span style="font-size:12px;font-weight:600;color:var(--ink-soft);">Cobrado:</span><input type="number" class="abono-monto" data-id="'+v.id+'" value="'+saldo.toFixed(2)+'" min="0" max="'+saldo.toFixed(2)+'" step="0.01">'
      + '<button class="btn btn-sm" data-action="registrar-abono" data-id="'+v.id+'" data-metodo="efectivo">✓ Efvo.</button>'
      + '<button class="btn btn-sm" data-action="registrar-abono" data-id="'+v.id+'" data-metodo="banco">✓ Banco</button>'
      + '<button class="btn btn-sm yape" data-action="registrar-abono" data-id="'+v.id+'" data-metodo="yape">✓ Yape</button>'
      + '<button class="btn btn-sm plin" data-action="registrar-abono" data-id="'+v.id+'" data-metodo="plin">✓ Plin</button>';
  }

  function viewPorCobrar(){
    var vistaToggle = '<div class="pay-toggle" style="max-width:420px;margin-bottom:18px;">'
      + '<button class="pay-opt'+(ui.cobrarVista==="pendientes"?" on":"")+'" data-action="cobrar-vista" data-vista="pendientes">Pendientes</button>'
      + '<button class="pay-opt'+(ui.cobrarVista==="historial"?" on":"")+'" data-action="cobrar-vista" data-vista="historial">Historial de cobros</button>'
      + '</div>';

    if(ui.cobrarVista === "historial"){
      var yearStepper = '<div class="stepper">'
        + '<button data-action="cobrar-year-prev" aria-label="Año anterior">‹</button>'
        + '<span class="stepper-label">'+ui.cobrarYear+'</span>'
        + '<button data-action="cobrar-year-next" aria-label="Año siguiente">›</button>'
        + '</div>';
      var monthStepper = '<div class="stepper">'
        + '<button data-action="cobrar-month-prev" aria-label="Mes anterior">‹</button>'
        + '<span class="stepper-label">'+MESES[ui.cobrarMonth-1]+'</span>'
        + '<button data-action="cobrar-month-next" aria-label="Mes siguiente">›</button>'
        + '</div>';

      var eventos = [];
      state.ventas.filter(function(v){ return v.tipoPago==="credito"; })
        .filter(function(v){ return !ui.soloMisVentas || !currentUser || v.vendedor===currentUser.nombre; })
        .forEach(function(v){
          abonosEfectivos(v).forEach(function(a){
            var fp = parseFecha(a.fecha);
            if(fp.anio===ui.cobrarYear && fp.mes===ui.cobrarMonth){
              eventos.push({ venta:v, monto:Number(a.monto)||0, metodo:a.metodo, fecha:a.fecha });
            }
          });
        });

      var byDia = {};
      eventos.forEach(function(ev){ (byDia[ev.fecha]=byDia[ev.fecha]||[]).push(ev); });
      var dias = Object.keys(byDia).sort(function(a,b){ return b<a?-1:1; });
      var totalCobrado = eventos.reduce(function(s,ev){return s+ev.monto;},0);
      var porMetodo = {};
      eventos.forEach(function(ev){ porMetodo[ev.metodo] = (porMetodo[ev.metodo]||0)+ev.monto; });

      var body = !dias.length ? '<p class="empty">Sin cobros de pendientes registrados en '+MESES[ui.cobrarMonth-1]+' '+ui.cobrarYear+'.</p>' : dias.map(function(d){
        var lista = byDia[d].slice().sort(function(a,b){ return (a.venta.creadoEn||0)-(b.venta.creadoEn||0); });
        var dTotal = lista.reduce(function(s,ev){return s+ev.monto;},0);
        var rows = lista.map(function(ev){
          var v = ev.venta;
          var esParcial = ev.monto < v.total - 0.009;
          return '<div class="note-row">'
            + '<div class="who"><span class="corr">N° '+String(v.correlativo).padStart(6,"0")+'</span> — '+escapeHtml(v.cliente)+' <span style="color:var(--ink-soft);">(vendido '+fechaDisplay(v.fecha)+(esParcial?', abono parcial':'')+')</span></div>'
            + '<div style="display:flex;align-items:center;gap:8px;"><span class="pay-tag '+metodoTagClass(ev.metodo)+'">'+metodoLabel(ev.metodo)+'</span><span class="amt">'+fmt(ev.monto)+'</span>'
            + '<button class="go" data-action="ver-venta" data-id="'+v.id+'">ver</button></div>'
            + '</div>';
        }).join("");
        return '<details class="month" open><summary>'+fechaDisplay(d)+' <span class="chev">▾</span> <span class="month-total">'+fmt(dTotal)+'</span></summary>'
          + '<div class="day-block">'+rows+'</div></details>';
      }).join("");

      return ''
        + '<h1 class="section-title">Historial de cobros</h1>'
        + '<p class="section-sub">Notas que estuvieron pendientes de pago y ya se cobraron, por mes y fecha.</p>'
        + '<div class="toolbar">'+yearStepper+monthStepper+soloMiosToggleHtml()+'</div>'
        + vistaToggle
        + (eventos.length ? '<div class="stat-row">'
          + '  <div class="stat hi"><div class="label">Total cobrado</div><div class="value">'+fmt(totalCobrado)+'</div></div>'
          + (porMetodo.efectivo ? '  <div class="stat"><div class="label">Efectivo</div><div class="value" style="font-size:19px;">'+fmt(porMetodo.efectivo)+'</div></div>' : '')
          + (porMetodo.banco ? '  <div class="stat"><div class="label">Banco</div><div class="value" style="font-size:19px;">'+fmt(porMetodo.banco)+'</div></div>' : '')
          + (porMetodo.yape ? '  <div class="stat"><div class="label" style="color:#742284;">Yape</div><div class="value" style="font-size:19px;color:#742284;">'+fmt(porMetodo.yape)+'</div></div>' : '')
          + (porMetodo.plin ? '  <div class="stat"><div class="label" style="color:#049a91;">Plin</div><div class="value" style="font-size:19px;color:#049a91;">'+fmt(porMetodo.plin)+'</div></div>' : '')
          + '</div>' : '')
        + body;
    }

    var pendientes = state.ventas.filter(estaPendiente)
      .filter(function(v){ return !ui.soloMisVentas || !currentUser || v.vendedor===currentUser.nombre; });
    var totalPendiente = pendientes.reduce(function(s,v){return s+saldoPendiente(v);},0);

    if(!pendientes.length){
      return ''
        + '<h1 class="section-title">Deudores</h1>'
        + '<p class="section-sub">Clientes que deben. Aquí ves cuánto debe cada uno.</p>'
        + vistaToggle
        + (soloMiosToggleHtml() ? '<div class="toolbar">'+soloMiosToggleHtml()+'</div>' : '')
        + '<p class="empty">No hay cuentas pendientes de cobro. 🎉</p>';
    }

    return ''
      + '<h1 class="section-title">Deudores</h1>'
      + '<p class="section-sub">Busca un cliente para ver cuánto debe por mes y día. Al recibir el dinero, pon el monto y toca "Cobrado" con el método: si es todo el saldo, la nota deja de aparecer como pendiente.</p>'
      + vistaToggle
      + '<div class="toolbar">'+soloMiosToggleHtml()+'<span class="mono" style="color:var(--danger);font-weight:600;">Total por cobrar: '+fmt(totalPendiente)+'</span></div>'
      + '<div class="field" style="max-width:420px;"><label for="cobrar-buscar">🔍 Buscar deudor (cliente que debe)</label><input id="cobrar-buscar" type="search" autocomplete="off" placeholder="Escribe el nombre del cliente" value="'+escapeHtml(ui.cobrarBuscar)+'"></div>'
      + '<div id="cobrar-lista">'+cobrarListaHtml(pendientes)+'</div>';
  }

  function cobrarListaHtml(pendientes){
    var q = (ui.cobrarBuscar||"").trim().toLowerCase();
    var lista = q ? pendientes.filter(function(v){ return String(v.cliente||"").toLowerCase().indexOf(q)>-1; }) : pendientes;
    if(!lista.length) return '<p class="empty">'+(q ? 'Ningún cliente con deuda coincide con "'+escapeHtml(ui.cobrarBuscar)+'".' : 'No hay cuentas pendientes de cobro. 🎉')+'</p>';
    var byCliente = {};
    lista.forEach(function(v){ (byCliente[v.cliente] = byCliente[v.cliente]||[]).push(v); });
    var clientes = Object.keys(byCliente).map(function(c){
      var notas = byCliente[c];
      return { cliente:c, notas:notas, total:notas.reduce(function(s,v){return s+saldoPendiente(v);},0) };
    }).sort(function(a,b){ return b.total-a.total; });

    return clientes.map(function(cl){
      var porMes = {};
      cl.notas.forEach(function(v){ (porMes[v.anio+"-"+String(v.mes).padStart(2,"0")] = porMes[v.anio+"-"+String(v.mes).padStart(2,"0")]||[]).push(v); });
      var meses = Object.keys(porMes).sort();
      var cuerpo = meses.map(function(k){
        var notasMes = porMes[k].slice().sort(function(a,b){ return (a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0) || (a.creadoEn||0)-(b.creadoEn||0); });
        var totMes = notasMes.reduce(function(s,v){return s+saldoPendiente(v);},0);
        var mm = Number(k.slice(5,7));
        var filas = notasMes.map(function(v){
